description: 'Named budget profiles for the Unattended Build Service. Reserved attended
  profile keeps all caps unset (ASSUM-010); unattended carries conservative caps. A
  pure evaluator judges over/within budget (first-breach-wins); on breach a running
  build pauses and raises a high-risk approval. Retro-planned: the skeleton (config
  + evaluator + CLI) is built and unit-tested; the live enforcement is deferred.'
