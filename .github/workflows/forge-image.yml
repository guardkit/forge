# =============================================================================
# forge-production-image — TASK-F009-007 (FEAT-FORGE-009 wave 3)
#
# TWO JOBS, two different purposes:
#
#   build-and-smoke-test  Builds and smoke-tests the canonical forge
#                         production image. Pull-request-only, and only
#                         for PRs touching the production-image surface,
#                         exactly as before. Closes binding-shape item 7
#                         and acceptance criteria AC-F (no real provider
#                         keys), AC-I (CI gate on PR), and the image-size
#                         budget regression check (B4 / ASSUM-003).
#
#   tests                 ADDED 2026-08-22. Runs 7,237 of forge's 7,257
#                         tests in about two minutes, on every push to
#                         main as well as on those PRs. See that job's
#                         own header for the measured pass/fail figures
#                         and for exactly which tests are excluded and
#                         why. Before it existed this workflow had run
#                         zero times in its life, so forge's real
#                         executed-test count in CI was 0, not the 26
#                         that ``pytest -m smoke tests/bdd/`` selects.
#
# Status-check names registered with GitHub:
#   forge-production-image / build-and-smoke-test
#   forge-production-image / tests
#
# This workflow is a Contract A *consumer* — it invokes
# scripts/build-image.sh (the canonical producer, TASK-F009-005) and
# MUST NOT inline the ``docker buildx build --build-context ...``
# command. T6's drift detector enforces this in the BDD tier; the
# unit-level check in tests/dockerfile/test_forge_image_workflow.py
# gives a faster signal.
#
# Sibling-checkout pattern: forge is checked out at
# $GITHUB_WORKSPACE/forge and nats-core at $GITHUB_WORKSPACE/nats-core
# so the BuildKit named context ``--build-context nats-core=../nats-core``
# resolves correctly when scripts/build-image.sh cd's into
# $GITHUB_WORKSPACE/forge before running buildx (TASK-FORGE-FRR-003).
# =============================================================================

name: forge-production-image

# Quoted ``"on":`` avoids the YAML 1.1 ``on -> True`` boolean coercion
# that some parsers apply.
"on":
  # PULL REQUESTS: unchanged. Only a PR touching the production-image
  # surface triggers this workflow, and only such a PR pays for a full
  # docker build + trufflehog scan.
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - src/forge/**
      - scripts/build-image.sh
      - .github/workflows/forge-image.yml
  # PUSH TO MAIN: added 2026-08-22. Before this, a push to main ran
  # NOTHING — this repository's only workflow fired on pull requests
  # alone, and forge merges to main through gates rather than through
  # PRs, so the workflow had never executed once (GitHub's Actions API
  # reported a total run count of 0). No path filter here on purpose:
  # any change that reaches main gets the test suite run against it.
  # The expensive image build is NOT part of that — the
  # build-and-smoke-test job below stays pull-request-only via its
  # ``if:`` guard, so this addition costs roughly two minutes of runner
  # time per push, not thirty.
  push:
    branches: [main]
  # Lets a human start the suite by hand from the Actions tab.
  workflow_dispatch:

# ``contents: read`` is the only permission the build needs. The
# secret-scan step does not require GITHUB_TOKEN write access — it
# only reads the local image.
permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke-test the production image
    # Pull-request-only, exactly as before the push-to-main trigger was
    # added. A docker build plus a trufflehog layer scan is a ~30 minute
    # job and pushes to main should not pay for it; the `tests` job
    # below is what a push to main runs.
    if: github.event_name == 'pull_request'
    # ubuntu-latest pins the runner architecture to linux/amd64. The
    # E3.2 scenario (architecture-mismatch) is meaningful only because
    # the runner architecture is a known constant — see the
    # "Verify image architecture" step below.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 1.0 GB uncompressed image-size budget per ASSUM-003 (B4).
      # Declared once here so a future budget change is a single edit.
      IMAGE_SIZE_BUDGET_BYTES: "1073741824"
      # Tag baked into scripts/build-image.sh — reused here so the size
      # / arch / smoke / scan steps all reference the same image.
      IMAGE_TAG: forge:production-validation

    steps:
      # ---------------------------------------------------------------
      # Step 1: Check out forge at $GITHUB_WORKSPACE/forge
      #
      # The default actions/checkout target is $GITHUB_WORKSPACE. We
      # override path: forge so the layout matches the runbook
      # (RUNBOOK-FEAT-FORGE-008-validation.md §0.4): forge and
      # nats-core as siblings under one parent directory.
      # ---------------------------------------------------------------
      - name: Check out forge
        uses: actions/checkout@v4
        with:
          path: forge

      # ---------------------------------------------------------------
      # Step 2: Check out nats-core at $GITHUB_WORKSPACE/nats-core
      #
      # ``--build-context nats-core=../nats-core`` in
      # scripts/build-image.sh resolves relative to the directory
      # buildx is invoked from. The script cd's into forge/
      # (i.e. $GITHUB_WORKSPACE/forge) before running buildx, so
      # ``../nats-core`` resolves to $GITHUB_WORKSPACE/nats-core —
      # the sibling working tree this checkout step lays down
      # (TASK-FORGE-FRR-003).
      # ---------------------------------------------------------------
      - name: Check out nats-core (sibling working tree)
        uses: actions/checkout@v4
        with:
          # Corrected 2026-08-22: this said ``appmilla/nats-core``, which
          # does not exist (the GitHub API returns 404 for it). The real
          # repository is ``guardkit/nats-core`` and it is public, so the
          # default GITHUB_TOKEN can read it — no secret needed.
          repository: guardkit/nats-core
          path: nats-core
          # ref left as default branch — nats-core ships from main on
          # tagged releases; if a future task needs a pinned ref it
          # belongs in this block.

      # ---------------------------------------------------------------
      # Step 3: Set up BuildKit-capable Docker
      #
      # actions/checkout's runner image already ships Docker, but
      # ``buildx`` is opt-in. setup-buildx-action wires up the buildx
      # plugin scripts/build-image.sh expects.
      # ---------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------------------------------------------
      # Step 4: Install forge and its test dependencies (uv, not pip)
      #
      # The smoke step (Step 8 below) runs pytest against the built
      # image from the forge working tree on the runner host (not
      # inside the container), so Python and the test deps must be
      # installed here.
      #
      # CORRECTED 2026-08-22. This step used to be
      # ``python -m pip install -e ".[dev]"`` and COULD NOT SUCCEED:
      # forge pins ``nats-core>=0.3.0,<0.8`` and no version in that
      # range is published to PyPI, so pip ends with "No matching
      # distribution found for nats-core". uv resolves nats-core from
      # the sibling checkout laid down by Step 2 (the ``[tool.uv.sources]``
      # entry ``nats-core = { path = "../nats-core" }``), which is the
      # only install path that works. ``[providers]`` is still omitted
      # on purpose — the smoke set does not import provider SDKs.
      #
      # ``--frozen`` IS LOAD-BEARING. The committed uv.lock declares
      # requires-python >=3.11 while pyproject.toml declares >=3.12. On
      # that mismatch uv DISCARDS the lock and re-resolves from scratch —
      # and re-resolution requires every path source in
      # ``[tool.uv.sources]`` to exist on disk, including
      # ``fleet-memory = { path = "../fleet-memory" }`` from the optional
      # ``memory`` extra. This job checks out forge and nats-core, not
      # fleet-memory, so a re-resolving ``uv sync`` dies with
      # "Distribution not found at: file:///.../fleet-memory" and the job
      # installs nothing. ``--frozen`` uses the committed lock as-is, so
      # no re-resolution happens and no absent sibling is consulted.
      #
      # MEASURED 2026-08-22 in a reproduction of this runner's layout
      # (forge + nats-core, NO fleet-memory): ``uv sync --extra dev``
      # fails as above; ``uv sync --frozen --extra dev`` exits 0 and the
      # suite then runs 7,223 tests.
      #
      # FOLLOW-UP, deliberately not done here: fix the requires-python
      # drift in uv.lock, then switch these steps to ``--locked``, which
      # FAILS LOUDLY when the lock is stale instead of silently using it.
      # ``--locked`` cannot be adopted today because the lock IS stale.
      # Re-locking currently moves 1,551 lines and downgrades watchfiles
      # 1.2.0 -> 1.1.1, which is a dependency change, not a CI-config
      # change, and wants its own lane.
      # ---------------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        working-directory: forge
        run: uv python install 3.12

      - name: Install forge test dependencies (uv, sibling nats-core)
        working-directory: forge
        run: uv sync --frozen --extra dev

      # ---------------------------------------------------------------
      # Step 5: Build the image via the canonical producer script
      #
      # Contract A: this is the ONLY place the docker buildx command
      # is invoked, and it is invoked through scripts/build-image.sh,
      # never inlined. T6's drift detector and the unit-level grep in
      # tests/dockerfile/test_forge_image_workflow.py both enforce
      # this. The script cd's into forge/ ($GITHUB_WORKSPACE/forge in
      # the runner layout) before executing buildx, which is why the
      # sibling-checkout pattern above works: ``../nats-core`` from
      # inside forge/ resolves to $GITHUB_WORKSPACE/nats-core
      # (TASK-FORGE-FRR-003).
      # ---------------------------------------------------------------
      - name: Build production image (scripts/build-image.sh)
        run: bash forge/scripts/build-image.sh

      # ---------------------------------------------------------------
      # Step 6: Image-size budget gate (ASSUM-003 / B4 scenario)
      #
      # The budget is uncompressed bytes per ASSUM-003. ``docker image
      # inspect --format '{{.Size}}'`` returns the uncompressed size
      # in bytes, which is what ``-gt`` compares against the budget
      # constant.
      #
      # The failure message names both the budget and the actual size
      # so a developer can see the magnitude of the regression
      # without re-running the workflow.
      # ---------------------------------------------------------------
      - name: Assert image size is within the 1.0 GB budget
        run: |
          set -euo pipefail
          SIZE=$(docker image inspect "${IMAGE_TAG}" --format '{{.Size}}')
          BUDGET="${IMAGE_SIZE_BUDGET_BYTES}"
          echo "Built image size: ${SIZE} bytes (budget: ${BUDGET} bytes)"
          if [ "${SIZE}" -gt "${BUDGET}" ]; then
            echo "::error::Image size ${SIZE} exceeds budget ${BUDGET} bytes (1.0 GB uncompressed, ASSUM-003)" >&2
            exit 1
          fi

      # ---------------------------------------------------------------
      # Step 7: Architecture-mismatch dry-check (E3.2 scenario)
      #
      # The runner is ubuntu-latest (linux/amd64). If a future
      # refactor ever moves builds to an ARM runner without updating
      # the runbook, the inspected ``.Architecture`` field will not
      # match ``amd64`` and this step fails with a named diagnostic
      # — documenting the cross-arch failure mode rather than letting
      # users trip over it at deploy time.
      # ---------------------------------------------------------------
      - name: Verify image architecture matches linux/amd64
        run: |
          set -euo pipefail
          ARCH=$(docker image inspect "${IMAGE_TAG}" --format '{{.Architecture}}')
          OS=$(docker image inspect "${IMAGE_TAG}" --format '{{.Os}}')
          echo "Built image platform: ${OS}/${ARCH}"
          if [ "${OS}" != "linux" ] || [ "${ARCH}" != "amd64" ]; then
            echo "::error::Image platform ${OS}/${ARCH} does not match runner platform linux/amd64 (E3.2 cross-arch failure mode)" >&2
            exit 1
          fi

      # ---------------------------------------------------------------
      # Step 8: BDD smoke set (T6 bindings)
      #
      # ``pytest -m smoke tests/bdd/`` runs the @smoke scenarios from
      # the FEAT-FORGE-009 feature against the built image. The
      # paired step modules in tests/bdd/ delegate the
      # container-runtime work to the Docker daemon already populated
      # by Step 5.
      # ---------------------------------------------------------------
      - name: Run @smoke BDD scenarios against the built image
        working-directory: forge
        env:
          FORGE_IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          uv run --no-sync pytest -m smoke tests/bdd/ -v

      # ---------------------------------------------------------------
      # Step 9: Provider-key scan (AC-F / C1 scenario)
      #
      # Scans every layer of the built image for real provider key
      # material. We use trufflehog's ``docker`` mode because it has
      # a well-tuned allowlist for placeholders such as
      # ``EXAMPLE_KEY_FOR_TESTING`` and avoids the false-positive
      # trap of a roll-your-own regex. The regex prefixes called out
      # by the AC (sk-, AIza, xoxb-) are part of trufflehog's default
      # ruleset.
      #
      # ``--fail`` exits non-zero on any verified or unverified
      # finding outside the allowlist, which fails the job as the AC
      # requires.
      # ---------------------------------------------------------------
      - name: Scan image layers for provider key material (sk-, AIza, xoxb-)
        uses: trufflesecurity/trufflehog@main
        with:
          # ``docker`` mode reads the local image straight from the
          # daemon — no registry push required.
          extra_args: >-
            --fail
            --no-update
            docker
            --image=${{ env.IMAGE_TAG }}

  # =============================================================================
  # tests — the suite that a push to main actually runs
  #
  # ADDED 2026-08-22. Before it, forge's automated testing was a single
  # step of the job above: ``pytest -m smoke tests/bdd/``, which selects
  # 26 of the repository's 7,257 tests, and which fired only on a pull
  # request touching five specific paths. Since forge merges to main
  # through gates rather than pull requests, that trigger had never
  # fired: GitHub's Actions API reported 0 runs of this workflow, ever.
  # The real before-figure is therefore 0 tests executed, not 26.
  #
  # MEASURED, 2026-08-22, on Python 3.12 (the version this job installs)
  # in a REPRODUCTION OF THIS RUNNER'S LAYOUT — forge and nats-core
  # unpacked as siblings by ``git archive``, with NO fleet-memory present,
  # which is what the checkout steps below actually lay down:
  #
  #     7,257 collected
  #        21 deselected  — 20 by the ``slow`` marker (docker builds and
  #                         live NATS brokers, which pyproject.toml
  #                         already documents as "excluded by default")
  #                         plus 1 named below: the live-broker
  #                         end-to-end test that carries no slow marker
  #     -----
  #     7,237 run  ->  7,222 pass, 14 skip, 1 FAIL, in 1 minute 47 seconds
  #
  # THE ONLY FIGURES HERE THAT COUNT ARE FROM A REAL RUNNER. This header
  # has now been wrong twice, both times because a local measurement was
  # quoted as if it were a CI one:
  #
  #   1st: 7,226 pass / 10 skip — measured in a working tree with a
  #        ../fleet-memory symlink no runner has, on Python 3.14 which no
  #        job here installs. Four fleet-memory-gated tests SKIP on a
  #        runner rather than pass.
  #   2nd: the "1 FAIL" above. The first real run of this job reported
  #        42 failed / 7,178 passed. 41 of those were the runner having no
  #        git identity, which the step below now fixes; the local box had
  #        one configured, so nothing local could ever have shown it.
  #
  # The single genuine failure named below survived both corrections and
  # is the real state. Anyone editing these numbers again: take them from
  # a run of this workflow, not from your machine.
  #
  # (7,257 minus 21 is 7,236, one short of the 7,237 pytest reports as
  # run. One item is counted once at collection and twice at run time —
  # a pytest-bdd scenario reported under two node ids. Both figures are
  # quoted as observed rather than reconciled by arithmetic.)
  #
  # The single failure is real and is deliberately left in:
  #     tests/forge/test_supervisor_async_subagent_wiring.py::
  #       TestDispatchAutobuildSignature::
  #       test_signature_has_exactly_five_collaborator_kwargs
  # ``dispatch_autobuild_async`` grew a sixth keyword argument, ``budget``,
  # and this test still asserts five. That is a genuine drift between the
  # code and its contract test, so this job is expected to be RED on
  # arrival until someone rules on which side is wrong.
  # =============================================================================
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # forge, nats-core and guardkit are laid down as siblings under
      # $GITHUB_WORKSPACE, matching the layout pyproject.toml's
      # ``[tool.uv.sources]`` assumes.
      - name: Check out forge
        uses: actions/checkout@v4
        with:
          path: forge

      # nats-core is a hard runtime dependency of forge that is NOT
      # installable from PyPI (see the install step in the job above).
      # Public repo, so the default GITHUB_TOKEN reads it.
      - name: Check out nats-core (sibling working tree)
        uses: actions/checkout@v4
        with:
          repository: guardkit/nats-core
          path: nats-core

      # guardkit is needed for 13 tests under tests/forge/planning/.
      # ``forge.planning.target_terminal_tools.discover_target_test_roots``
      # imports guardkit's test-root discovery and raises
      # TargetTestRootsUnresolved when it cannot; without this checkout
      # those 13 tests fail for a missing dependency rather than for
      # anything about forge. guardkit is a PUBLIC repository, so the
      # default GITHUB_TOKEN is enough — no secret is involved.
      - name: Check out guardkit (test-root discovery dependency)
        uses: actions/checkout@v4
        with:
          repository: guardkit/guardkit
          path: guardkit

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python 3.12
        working-directory: forge
        run: uv python install 3.12

      # Same install as the image job, and for the same reasons: pip
      # cannot resolve nats-core, uv can, from ../nats-core; and
      # ``--frozen`` is required because this job does not check out
      # fleet-memory, so a re-resolving ``uv sync`` cannot satisfy that
      # path source. See the long note in the image job above.
      - name: Install forge and its test dependencies
        working-directory: forge
        run: uv sync --frozen --extra dev

      # WHAT IS EXCLUDED, AND WHY. Both exclusions are for tests that
      # need infrastructure a GitHub runner does not have. Neither hides
      # a failing assertion.
      #
      #   -m "not slow"   20 tests. ``slow`` is forge's own registered
      #                   marker for "tests that require docker / live
      #                   NATS — excluded by default" (pyproject.toml).
      #                   The image job above is where the docker-backed
      #                   ones run, against a real built image.
      #
      #   --deselect ...  1 test. tests/integration/
      #                   test_forge_serve_orchestrator_e2e.py's
      #                   full-lifecycle test opens a real NATS
      #                   connection and times out when no broker
      #                   answers. It carries no ``slow`` marker, so the
      #                   marker expression above does not catch it and
      #                   it has to be named. Naming it here means the
      #                   exclusion is auditable; leaving it in would
      #                   mean a permanently red step whose redness said
      #                   nothing.
      #
      # PYTHONPATH puts the guardkit checkout on the import path for the
      # 13 planning tests described in the job header.
      #
      # ``-p no:randomly`` is not used and no seed is fixed: the suite
      # runs in collection order, as it does locally.
      # A GITHUB RUNNER HAS NO GIT IDENTITY, and forge's planning driver
      # commits through git in the code under test — not just in test
      # helpers. Without this step the driver's handoff write dies with
      # "Author identity unknown / fatal: empty ident name", the run is
      # recorded as FAILED instead of BUILD_QUEUED, and 41 tests fail for
      # a reason that has nothing to do with forge.
      #
      # MEASURED on the first real run of this job (2026-08-22): 42 failed
      # / 7,178 passed. 41 of the 42 were this. The test helpers in
      # test_driver_target_terminal.py already pass GIT_AUTHOR_* env vars
      # for their OWN seed commits, which is why the cause is easy to miss
      # — the commits that fail are the ones the production path makes.
      #
      # --global, not --local: the code under test creates repositories in
      # temporary directories, so a per-repo identity would not reach them.
      - name: Give the runner a git identity (the code under test commits)
        run: |
          git config --global user.email "ci@forge.invalid"
          git config --global user.name "forge CI"

      - name: Run the suite
        working-directory: forge
        env:
          PYTHONPATH: ${{ github.workspace }}/guardkit
        run: |
          uv run --no-sync pytest -q -rf --tb=short \
            -m "not slow" \
            --deselect "tests/integration/test_forge_serve_orchestrator_e2e.py::TestForgeServeLifecycleE2E::test_full_lifecycle_envelope_sequence_and_correlation"
