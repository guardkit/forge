# ---------------------------------------------------------------------------
# The factory's release manifest — what exactly goes into one Forge release,
# and which images come out of it.
#
# Written 2026-09-24. Until this file existed, the Forge image was built from
# whatever four checkouts happened to sit beside forge/ on one machine
# (scripts/build-image.sh), so "the same release on two machines" was not
# possible. This file is the answer: every input named by its repository, the
# exact commit, and the branch that commit came from, plus the Python base
# image the Dockerfiles pin.
#
# It is read by scripts/build-release-image.sh, which fetches each repository
# from GitHub at the commit below into a fresh temporary folder and builds
# every image below from those clones alone. Nothing beside forge/ is used.
#
# All six repositories are public, so fetching them needs no credential.
#
# To cut a new release: change the commits and the version, then run
#   scripts/build-release-image.sh /path/to/manifest.yaml
# from any directory. The script refuses if a commit cannot be fetched, if a
# clone lands on a different commit, or if the base image digest here has
# drifted from the one in any of the Dockerfiles named below.
#
# Format note: this is a deliberately small, flat subset of YAML so that the
# build script can read it with awk alone. A second machine therefore needs
# only this file, Docker, and network access to GitHub — no YAML tool, no
# language runtime, no checkout. Keep it to "key: value" at the top level and
# to the exact keys per list entry below.
# ---------------------------------------------------------------------------

# Schema 2 (24 September 2026): a release is a SET of images, listed under
# "images:" below, and no longer a single one named by "image_name". Schema 1
# manifests still build — the script reads them as one image, the
# coordinator's, from the build-context root's own Dockerfile.
schema: 2
# 2026.09.24-7 (24 September 2026, stage 4e, after its review). What it adds to
# release 5: the two folders both of a sandbox's containers share are made and
# bound as mounts, a refused second start of the bootstrap exits 4 with its
# sentence, and the image carries the docker CLIENT — pinned, checksummed, no
# daemon — so the factory's deploy helper can run a deploy a project declares
# that brings containers up. The forge pin below moves with it; the other four
# repositories are at the same commits release 5 was cut from, which are still
# their main on GitHub today (checked 24 September 2026).
#
# WHY 7 AND NOT 6. This line said 2026.09.24-6 for about an hour, pinning forge
# at 4e096ddc. NO SUCH RELEASE WAS EVER BUILT: cutting one fetches the pin from
# GitHub and that commit is local, so the script refused at the door and no
# forge:2026.09.24-6 or forge-publisher:2026.09.24-6 image or tag exists
# anywhere. The review of that work then asked for two sentences to be said
# better, in a file that IS in the image, so the image's contents changed. A
# release number names one set of bytes, so rather than let 2026.09.24-6 mean
# two different things it is left unused and this is 7. There is no gap to
# explain in any registry, because 6 never reached one.
#
# 2026.09.25-2 (25 September 2026, stage 4b). What it adds to 2026.09.25-1: the
# MEMORY SERVICE AND ITS RELAY are images of the release, built from the memory
# repository's clone at the pin below. A release is four images now, not two.
# Two pins move with it — forge, for the build script that can build an image
# from another repository's clone, and fleet-memory, for the two Dockerfiles
# that now pin the release's one base image by digest instead of a floating tag.
#
# 2026.09.25-3 (25 September 2026, stage 4b after its review). Only the forge
# pin moves; fleet-memory is at the same commit. What it changes in the images:
# each one's org.opencontainers.image.revision and .source now name the
# repository THAT image was built from, where before both were taken once from
# the build-context root — so the two memory images reported Forge's commit and
# Forge's address while their own tags said fleet-memory's. The images
# themselves are otherwise the same code, and the release number moves because
# their labels do: a release name means one set of bytes.
#
# NOTE ABOUT THE TWO MEMORY IMAGES' BASE, said here because it is easy to read
# the fleet-memory pin as only a pin. The digest below is Python 3.14.4; the
# fleet-memory images running today were built from a floating python:3.12-slim
# and are on 3.12.13. Pinning was necessary — a release refuses a Dockerfile
# with no digest — but it carries a two-minor-version upgrade with it, for
# anybody rebuilding fleet-memory from its own compose file as well. It was
# tested rather than assumed (the package installs, both entry modules import,
# and a real message went end to end on 3.14).
#
# 2026.09.25-4 (25 September 2026, stage 4c). What it adds to 2026.09.25-3: the
# SLACK FRONT DOOR AND THE BUS GATEWAY are one image of the release, built from
# the jarvis repository's clone at the pin below — a SIXTH repository, and the
# second built from a repository other than the one the release is cut from. A
# release is five images now, not four. Two pins move with it: jarvis, for the
# Dockerfile that did not exist until today, and forge, for the proof script
# that opens that image and the estate that runs the two services out of it.
#
# 2026.09.25-5 (25 September 2026, stage 4c after its review). Nothing new is
# built and no service does anything different: three things that were written
# down wrongly are written down rightly. The jarvis pin moves, because the
# sentence corrected is in that repository's own Dockerfile; the forge pin moves
# with it, because the other two corrections are here and in the estate.
#
#   * the jarvis image's Dockerfile listed "no machine name" among the things
#     deliberately not in it, and that was not true: the jarvis package
#     hard-codes a host name as its default model-seat address, so the name
#     rides into the image's filesystem. It pre-dates this packaging, in a
#     repository that is already public, and the estate always supplies that
#     address — so it changes nothing about the rollout, but the claim had to
#     stop being made;
#   * this note itself named ONE repository to push, below, and there are two;
#   * the estate's front-door service gave a wrong reason for waiting on the
#     bus. It opens no bus connection at start-up at all — its graphs are
#     imported, and nothing in them connects to anything until a message is
#     handled. The wait is still right, for the reason now written there.
#
# 2026.09.25-4 IS LEFT UNUSED, and it was never built — cutting it fetches the
# pins from GitHub and both were local, so the script refused at the door and no
# image or tag of it exists anywhere. Its pins have now moved, so rather than
# let one release number mean two sets of commits, this is 5. There is no gap to
# explain in any registry, because 4 never reached one — the same reasoning that
# left 2026.09.24-6 unused above.
#
# 2026.09.25-6 (25 September 2026, stage 4c after its second review). TWO REAL
# CHANGES, one in each repository, and between them they are the difference
# between a release that cannot honestly be cut and one that can.
#
#   * THE HOST NAME IS OUT OF THE JARVIS SOURCE. That package hard-coded a real
#     machine's name as the DEFAULT model-seat address, so anyone who ran it
#     with the setting unset was pointed at somebody else's machine without
#     being told, and the name rode into every image built from a repository
#     that is public. There is no default now and no neutral stand-in either:
#     an unset JARVIS_LLAMA_SWAP_BASE_URL is refused BY NAME at the point the
#     address is needed. Nothing about how the estate runs it changes — the
#     estate has always supplied that address and refused to start without it;
#   * THE JARVIS IMAGE STOPS SHIPPING ANOTHER REPOSITORY'S CHECKOUT. Its
#     Dockerfile copied the whole nats-core clone into /tmp and deleted it four
#     lines later. A deleted file is gone from what a container sees and still
#     in what a push sends, and at the nats-core pin below that clone carries
#     an account name in 127 tracked files. The Dockerfile has two stages now:
#     the copy happens in a builder that nothing ships, and only the installed
#     virtual environment crosses into the image;
#   * AND THE SWEEP WAS READING THE WRONG COPY. It exported each image — the
#     flattened final filesystem — so it would have called that image clean
#     while its layers carried this machine's account name in 2,194 files. It
#     reads every layer a push would send as well now, refuses on a hit naming
#     the image, the file, the layer and the word, and removes the tags the
#     refused run wrote. Two smaller things travel with it: the estate's
#     .env.example no longer reads as though filling it in arms the sweep, and
#     the two proof scripts say what they do not cover.
#
# THE ONE EXCEPTION THIS RELEASE NEEDS is at the bottom of this file, under
# `sweep_exceptions:`. guardkit's feature-plan.md carries this estate's host
# names as the PATTERNS its live-infrastructure detector looks FOR, and taking
# them out would switch a check off rather than make anything portable.
#
# 2026.09.25-5 WAS NEVER BUILT EITHER — both of its pins were local, so the
# script refused at the fetch and no image or tag of it exists anywhere. Both
# pins move here, so rather than let one release number mean two sets of
# commits this is 6, which is the reasoning that left 4 and 2026.09.24-6
# unused above. There is no gap to explain in any registry.
#
# BOTH PINS BELOW WERE PUSHED BEFORE THIS RELEASE WAS CUT (25 September 2026,
# 23:03 UTC): a build from this manifest fetched every one of the six
# repositories from GitHub and built five images. An earlier version of this
# note, written while the forge and jarvis pins were local, said the build
# would stop at the fetch; it did, then, which was the check working.
version: 2026.09.26-1

# The one image this repository's own operator scripts mean by "the release
# image" (ops/forge-prod-recreate.sh reads this line). It is the same name as
# the images: entry whose role is coordinator, and the build script refuses if
# the two ever disagree.
image_name: forge

# The Python base image EVERY stage of EVERY Dockerfile below starts FROM. The
# build script reads each Dockerfile's own FROM lines and refuses to build if
# any of them disagrees with this line, so the pin cannot quietly drift out of
# the manifest and the images of one release cannot end up on two bases.
python_base_digest: sha256:2e256d0381371566ed96980584957ed31297f437569b79b0e5f7e17f2720e53a

# ---------------------------------------------------------------------------
# THE IMAGES THIS RELEASE IS MADE OF.
#
# All five are built in ONE run, from ONE set of fetched clones, and all five
# carry the same release labels — every commit, the manifest's hash, the
# version — plus their own role. That is what makes them a set: they cannot be
# built from different code and still answer to the same release name.
#
#   name        the image's name; its two tags are <name>:<its context's
#               commit> and <name>:<version>
#   context     which of the repositories below its Dockerfile and its build
#               context come from. Left out, it is the build-context root —
#               which is what every image of every earlier release meant
#   dockerfile  the file it is built from, as a path INSIDE the fetched clone
#               of its context. Never a path on a machine
#   role        which of the release's images this is. It goes into a label
#   proof       the script, from the fetched clone of the BUILD-CONTEXT ROOT,
#               that has to pass before the release calls itself built
# ---------------------------------------------------------------------------
images:
  - name: forge
    dockerfile: Dockerfile
    role: coordinator
    proof: scripts/verify-forge-oracles.sh
  # THE PUBLISHER'S OWN IMAGE. Built for the first time on 24 September 2026.
  # Before that the release built only the coordinator's, so every proof of
  # the publisher ran the coordinator's image with the publisher's start line
  # — a stand-in. The publisher is the one process holding the credential that
  # can write to a project's remote, and its separateness IS the wall, so the
  # image the wall is made of is now built and proved with everything else.
  - name: forge-publisher
    dockerfile: src/forge/publisher/Dockerfile
    role: publisher
    proof: scripts/verify-publisher-image.sh
  # THE TWO MEMORY IMAGES. Built as part of a release for the first time on
  # 25 September 2026. Before that they were built by hand on one machine out
  # of a checkout, with `docker compose up -d --build`, on a floating base tag,
  # so "the same memory service on two machines" was not something anybody
  # could have had.
  #
  # They are the first images of a release built from a repository OTHER than
  # the one the release is cut from. `context:` names which of the pinned
  # repositories below each one's Dockerfile and build context come from, so
  # these two are built from the fleet-memory clone at the fleet-memory pin and
  # tagged by THAT commit. Their proof is one of this repository's own scripts,
  # because a release's proofs belong to the release.
  - name: fleet-memory-mcp
    context: fleet-memory
    dockerfile: deploy/mcp/Dockerfile
    role: memory
    proof: scripts/verify-fleet-memory-image.sh
  - name: fleet-memory-relay
    context: fleet-memory
    dockerfile: deploy/relay/Dockerfile
    role: memory-relay
    proof: scripts/verify-fleet-memory-image.sh
  # THE JARVIS IMAGE. Built as part of a release for the first time on 25
  # September 2026. Before that the Slack front door and the bus gateway ran as
  # host units out of a checkout and a virtual environment under a home
  # directory, so "the same front door on two machines" was not something
  # anybody could have.
  #
  # ONE IMAGE, TWO SERVICES, which is why there is one entry here and not two:
  # the front door serves the graphs that repository declares, the gateway is
  # the same package's own command on the bus, and they share every dependency.
  # The estate starts them with two different commands out of this one image —
  # the same shape the coordinator and the answer service already have. The
  # role says 'front-door' because that is the service the image's own CMD is,
  # and its proof holds the estate's two commands to what the image can run.
  - name: jarvis
    context: jarvis
    dockerfile: deploy/Dockerfile
    role: front-door
    proof: scripts/verify-jarvis-image.sh

# The six repositories that make up the images above.
#   role: build-context-root  — the Dockerfile and the main build context
#   role: named-context       — supplied to the build as --build-context <name>=<clone>
repositories:
  # The first repository fetched, so the first a build would refuse on if its
  # pin were not on GitHub; this one is (pushed 25 September 2026, 23:03 UTC).
  - name: forge
    url: https://github.com/guardkit/forge.git
    branch: main
    commit: 1fc6b600278d76cad6a384f405599faa2054ab42
    role: build-context-root
  - name: guardkit
    url: https://github.com/guardkit/guardkit.git
    branch: main
    commit: f126713696a459e8f129ef63af4afa8a0748eb77
    role: named-context
  - name: nats-core
    url: https://github.com/guardkit/nats-core.git
    branch: main
    commit: fc7bdbbe54aa158a7d77ed7a76eeaab137b6a66c
    role: named-context
  - name: fleet-memory
    url: https://github.com/guardkit/fleet-memory.git
    branch: main
    commit: 18ab7de6a250bc31a602f0d5733ef8eb99698686
    role: named-context
  - name: guardkitfactory
    url: https://github.com/guardkit/guardkitfactory.git
    branch: main
    commit: 8358670e3c57442bcc8862ea4ff96a7f4ec78dc7
    role: named-context
  # THE SIXTH REPOSITORY (25 September 2026). It is a named context like the
  # four above — the jarvis image is built from ITS clone, at this pin, and
  # tagged by this commit — and it is also, like fleet-memory, a repository the
  # release builds an image FROM rather than merely copies code out of.
  #
  # Pushed 25 September 2026, 23:03 UTC, together with the forge pin above; the
  # release was built from GitHub after both were.
  - name: jarvis
    url: https://github.com/guardkit/jarvis.git
    branch: main
    commit: caec2e5c4c617933b365c73aaef1bbd6b0dc8dbd
    role: named-context

# ---------------------------------------------------------------------------
# THE FILES A SWEEP HIT IS ALLOWED IN — BY PATH, NEVER BY WORD
#
# Added 25 September 2026 with the release sweep. After each image is built,
# scripts/build-release-image.sh searches its whole filesystem, EVERY LAYER a
# push would send, its configuration, its labels and its history for the words
# the MACHINE gives it in RELEASE_SWEEP_TERMS, and refuses the release on a hit.
#
# A file may legitimately carry one of those words. The only way to say so is
# to name THE FILE, because "allow this word" would write a real machine's name
# back into this tracked, public file — which is the defect the sweep exists to
# stop. The path is matched as the END of the file's path inside the image, so
# it can be written the way a person reads it, without anybody having to know
# which site-packages directory a base image happens to use.
#
# Each entry needs an image, a path and a reason; the build refuses one that is
# missing any of them, or that names an image this release does not build.
sweep_exceptions:
  # GuardKit's feature-plan command carries two of this estate's machine names
  # as the PATTERNS its live-infrastructure detector looks FOR, in the table
  # that decides whether a planned task needs a human at a real machine. Taking
  # them out would switch a check off rather than make anything portable, so the
  # file is named here instead. (The names themselves are not written here: this
  # file is public, and a sweep's words come from the machine, never from a file.)
  #
  # AT TODAY'S PINS IT DOES NOT FIRE, and that is said rather than left to be
  # discovered: the guardkit commit below carries no full host name in anything
  # the forge image installs. It fires the moment an operator's terms include
  # the stem of that host name or the other machine's name — which is exactly
  # when a release would otherwise refuse on a detector doing its job.
  - image: forge
    path: guardkit/_installer_core/commands/feature-plan.md
    reason: the live-infrastructure detector's own patterns
