# ---------------------------------------------------------------------------
# THE ESTATE BUNDLE (24 September 2026, stage 4a of the containerisation
# rollout gate).
#
# The design calls this "the only thing a new machine clones": one small set of
# files that starts the factory's own services on a clean machine, local or
# cloud, with nothing edited but the env file beside it.
#
# IT COMPOSES, IT DOES NOT COPY. Forge's own two compose files are pulled in
# with 'include:' below, so there is ONE description of the coordinator, the
# answer service, the publisher and the sandbox service, and this file cannot
# drift away from them. Everything this file adds is the part of the estate
# that Forge does not own.
#
# WHAT IT ADDS: the bus, the one-shot that provisions the bus's storage before
# the coordinator is allowed to start, and the two containers that are the
# memory service.
#
# BRING IT UP (the passwords come from a child process, never from a file
# here — see README.md):
#
#     Choose absolute FACTORY_ESTATE_DIR/ENV, an explicit project, and
#     DOCKER_HOST=unix:///var/run/docker.sock as README.md specifies.
#     ./publisher-host-policy describe --project "$FACTORY_ESTATE_PROJECT"
#     Install and verify the policy, then run estate-check host, using the same
#     absolute env, project and local endpoint. Use README.md's exact ordered
#     local or external bus-mode up command.
#     ./estate-check services         # a clean shell: these need no password
#     ./factory-hello
#
# The first two of those four are run the way the START is run, because one of
# the things the host check checks is that the passwords have values. The last
# two need no secret at all and are run from an ordinary shell.
#
# TWO BUS MODES (26 September 2026, build item E1). BUS_MODE in the env file
# says which, and it is the only line that has to change:
#
#   local      this bundle starts its own bus and provisions its storage. The
#              clean-machine and cloud path, and what every earlier proof used.
#              The env file sets COMPOSE_PROFILES=local-bus
#   external   the bus is ALREADY RUNNING and belongs to somebody else. This
#              bundle starts no bus and provisions nothing: it joins the bus's
#              network as one that already exists and READS the bus's own
#              configuration to check it against the pinned definitions. The env
#              file sets COMPOSE_FILE=compose.yaml:compose.external-bus.yaml and
#              leaves COMPOSE_PROFILES empty
#
# README.md says when each is used and what external mode deliberately does not
# do. 'estate-check host' refuses when BUS_MODE and those two settings disagree.
#
# A MACHINE THAT LOOKS AFTER A SANDBOX ADDS IT TO THE PROFILES LINE —
# COMPOSE_PROFILES=local-bus,sandbox — and does NOT pass '--profile sandbox' on
# the command line. Checked on this machine's Compose (v5.2.0): '--profile' on
# the command line REPLACES the env file's profiles rather than adding to them,
# so '--profile sandbox' in local mode takes the bus and the provisioner out of
# the project. It fails loudly rather than quietly — the project will not render
# at all, because 'bus-ready' below then names a service that is not there — but
# the line to change is the env file's.
#
# TAKE IT DOWN:  docker compose --env-file .env down      # keeps the volumes
#                docker compose --env-file .env down -v   # and removes them
# ---------------------------------------------------------------------------

include:
  # FORGE'S OWN SERVICES: the coordinator, the read-only answer service, and
  # the publisher (which that file in turn composes in from the publisher's own
  # fragment). Composed, never copied.
  - path: ../compose/compose.yaml
  # ONE PROJECT'S SANDBOX, looked after by a container. It carries a profile
  # below, so a machine with no sandbox never starts it and does not have to
  # comment anything out; a machine that looks after one adds
  # '--profile sandbox'.
  - path: ../compose/compose.sandbox-runner.yaml

services:

  # -------------------------------------------------------------------------
  # THE BUS — the message service everything talks over.
  #
  # It is built from the bus repository's OWN Dockerfile and runs its OWN
  # config, both taken from that repository at a pinned commit by
  # ./build-estate-images.sh. Nothing is copied into this repository and
  # nothing is built by compose: the image is named here and built there, the
  # same way the release images are named here and built by the release script.
  #
  # ITS PASSWORDS ARE PASSED IN FROM A CHILD PROCESS, never read from a file in
  # this bundle. That is the bus repository's own arrangement and the reason
  # for it is worth keeping: an env_file whose values were still encrypted
  # would feed ciphertext through the template renderer and produce a broker
  # with unusable accounts, whereas this way a value can only ever be a real
  # one, from the environment the command was run in.
  #
  # BUT THEY DO NOT GO INTO THE CONTAINER'S ENVIRONMENT. The bus repository's
  # own compose file puts all eight in 'environment:', where 'docker inspect'
  # shows them to anybody who can reach the Docker daemon, and where they are
  # copied into the container's declared configuration on disk. Here each one
  # arrives as a FILE (the 'secrets:' at the foot of this file, each read from
  # the environment the command was run in), and the small wrapper below puts
  # them into the environment of the bus's own entrypoint PROCESS and nothing
  # else. The bus's entrypoint is unchanged and does not know the difference.
  #
  # A missing value still fails loudly, in two places: compose refuses to start
  # a service whose secret names an environment variable nothing set, and the
  # wrapper refuses an empty file by name.
  #
  # IT IS BEHIND A PROFILE (26 September 2026, build item E1), because an estate
  # started against a bus that is already running must not start a second one. A
  # service behind a profile that is not asked for is NOT IN THE PROJECT AT ALL:
  # not started by 'up', not restarted by 'restart', not brought back by a second
  # 'up'. That is real exclusion, and it is the same mechanism the sandbox
  # service at the foot of this file already uses. Local mode asks for the
  # profile; external mode does not.
  # -------------------------------------------------------------------------
  nats:
    profiles: ["local-bus"]
    image: ${NATS_IMAGE:?name the bus image in the env file, e.g. NATS_IMAGE=factory-nats:2026.09.24-7 - built by ./build-estate-images.sh from the bus repository at its pinned commit}
    restart: unless-stopped
    # Every '$$' below is a dollar sign for the SHELL, escaped so that compose
    # leaves it alone. The last item is the shell's $0; the image's own command
    # ('-c /etc/nats/nats-server.conf') follows it and is what "$@" hands on.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        for account in ADMIN RICH JAMES MARK FORGE FLEET_MEMORY GUARDKIT JARVIS; do
            variable="$${account}_NATS_PASSWORD"
            file="/run/secrets/$$(printf '%s' "$${variable}" | tr 'A-Z' 'a-z')"
            if [ ! -s "$${file}" ]; then
                echo "the bus was given no $${variable}: the estate passes each of the bus's eight account passwords in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says, with the values passed in from a child process." >&2
                exit 1
            fi
            value="$$(cat "$${file}")"
            export "$${variable}=$${value}"
        done
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - the-estate-hands-the-bus-its-passwords-as-files
    # THE BUS'S OWN COMMAND, WRITTEN OUT BECAUSE NAMING AN ENTRYPOINT HERE
    # EMPTIES IT. Compose drops the image's own command whenever a service
    # names an entrypoint, and a nats-server started with no command reads no
    # config at all: it listens on 4222, serves no monitoring route, holds no
    # JetStream, and looks perfectly healthy in its own log while the estate's
    # health probe fails. This line is the bus image's command, unchanged, and
    # it must stay the same as the image's.
    command: ["-c", "/etc/nats/nats-server.conf"]
    secrets:
      - source: bus-admin-password
        target: admin_nats_password
      - source: bus-rich-password
        target: rich_nats_password
      - source: bus-james-password
        target: james_nats_password
      - source: bus-mark-password
        target: mark_nats_password
      - source: bus-forge-password
        target: forge_nats_password
      - source: bus-fleet-memory-password
        target: fleet_memory_nats_password
      - source: bus-guardkit-password
        target: guardkit_nats_password
      - source: bus-jarvis-password
        target: jarvis_nats_password
    volumes:
      # THE BUS'S OWN CONFIG, READ-ONLY — exactly the two mounts the bus
      # repository's own compose file makes, at the same two places, but out of
      # a VOLUME rather than a folder on a disk. The bus's config is part of the
      # release, not part of a machine, so it travels with the images: the build
      # step fetches the bus repository at its pin and fills this volume, and
      # nothing in the running estate names a path belonging to anybody.
      - type: volume
        source: bus-source
        target: /etc/nats/nats-server.conf
        read_only: true
        volume:
          subpath: config/nats-server.conf
      - type: volume
        source: bus-source
        target: /etc/nats/config/accounts
        read_only: true
        volume:
          subpath: config/accounts
      # ITS STORE. The design's table calls this volume nats-jetstream and says
      # the bus is its one writer.
      - nats-jetstream:/data/jetstream
    networks:
      - factory
    ports:
      # THE SECOND AND LAST PUBLISHED PORT IN THE ESTATE, and for the same
      # reason as the first: a sandbox is a separate small machine that cannot
      # reach a service name, so its route to the bus goes through the factory
      # gateway address. The monitoring port is NOT published — the estate's
      # own check asks for it from inside the network.
      #
      # The per-route refusal rule (this listener, this port, this allowed
      # source, refused to everything else including the local network) is NOT
      # enforced by this bundle yet. README.md lists it as a rollout
      # precondition, and until it is enforced the gateway address must be a
      # private address of this machine.
      - "${FACTORY_GATEWAY_ADDRESS:?name this machine's factory gateway address in the env file}:${NATS_CLIENT_PORT:?name the port the bus is published on in the env file}:4222"
    healthcheck:
      # The bus repository's own probe, unchanged.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -------------------------------------------------------------------------
  # PROVISIONING THE BUS'S STORAGE — a one-shot that runs once at every start,
  # does nothing if there is nothing to do, and exits 0.
  #
  # WHY IT EXISTS. On 24 September 2026 a reviewer brought the bundle up
  # against a bus that had never been provisioned and the coordinator restarted
  # in a loop showing a programmer's error: it needs the bus's 'agent-registry'
  # key-value bucket and its 'PIPELINE' stream to exist before it can register
  # at all. The live bus was provisioned by hand months ago, so nobody had met
  # this. It is a precondition, so it belongs in the file that starts things
  # and not in a sentence somebody has to remember.
  #
  # It runs the bus repository's OWN provisioning scripts, from the same pinned
  # commit as the bus's config, against the bus. They are written to be safe on
  # every start: each bucket and stream is checked, then created or updated.
  #
  # WHY THE CREDENTIAL IS NOT IN THE ADDRESS. Those two scripts PRINT the
  # address they were given — "NATS URL: ..." and "Waiting for NATS server
  # at ..." — so an address of the usual nats://user:password@host form put the
  # password into this container's log at every start, on every machine, where
  # container logs routinely leave the box. (Found on 24 September 2026 by the
  # review of this bundle; nothing was exposed, because only throwaway
  # passwords had ever gone through it.) The scripts are the bus repository's
  # and the estate is what runs them, so the estate is what fixes it: the
  # address below carries NO credential and is safe to print, and the account's
  # password arrives as a FILE and is written into the nats client's own
  # context file, which is how that client is meant to be given one. The
  # scripts then authenticate without ever holding the password.
  #
  # IT IS BEHIND THE SAME PROFILE AS THE BUS (26 September 2026, build item E1),
  # and for a stronger reason than the bus: this is the one thing in the estate
  # that WRITES to a bus's storage. In external mode the bus belongs to somebody
  # else, so the mutating one-shot is not in the project to be run — by 'up', by
  # 'restart', or by anybody typing 'docker compose run'. What external mode has
  # instead is 'bus-ready' below, which only reads.
  # -------------------------------------------------------------------------
  nats-provision:
    profiles: ["local-bus"]
    image: ${NATS_PROVISION_IMAGE:?name the provisioning image in the env file - built by ./build-estate-images.sh}
    restart: "no"
    depends_on:
      nats:
        condition: service_healthy
    environment:
      # WHICH BUS — a service name on the factory network, and NO credential.
      # This is the value the scripts print.
      NATS_URL: ${NATS_PROVISION_ADDRESS:?name the address the provisioning runs against in the env file, e.g. nats://nats:4222 - a service name, with no credential in it}
      # AS WHOM. The account name is not a secret; its password is, and comes
      # in as a file below.
      NATS_PROVISION_USER: ${NATS_PROVISION_USER:?name the bus account the provisioning runs as in the env file - it needs JetStream rights}
      # The nats client writes its context folder here rather than into a home
      # folder in the image.
      XDG_CONFIG_HOME: /tmp/nats-config
    secrets:
      - source: bus-provision-password
        target: provision_password
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        umask 077
        case "$$NATS_URL" in
          *@*)
            echo "the provisioning address carries a credential. The bus repository's scripts print this address, so it must be a plain address: give the password as a password name in the env file instead." >&2
            exit 1
            ;;
        esac
        mkdir -p "$$XDG_CONFIG_HOME"
        # The credential goes into the nats client's own context file and
        # nowhere else. 'nats context save' prints the context it wrote with
        # the password masked; the scripts below are then given a plain address
        # on the command line, and take the account and its password from the
        # context.
        nats context save estate \
            --server "$$NATS_URL" \
            --user "$$NATS_PROVISION_USER" \
            --password "$$(cat /run/secrets/provision_password)" \
            --select
        # A second line of defence, not the fix: anything either script prints
        # that still looks like an address with a credential in it has the
        # credential replaced before it reaches this container's log.
        without_a_credential() { sed -E 's#(://[^:/@[:space:]]+):[^@[:space:]]*@#\1:***@#g'; }
        /bus/kv/provision-kv.sh 2>&1 | without_a_credential
        /bus/streams/provision-streams.sh 2>&1 | without_a_credential
    volumes:
      # THE BUS REPOSITORY'S OWN SCRIPTS AND DEFINITIONS, read-only, from the
      # same pinned commit as the bus's config. The factory keeps no copy of
      # them and does not second-guess them: the bus's storage is described in
      # the bus's repository.
      - type: volume
        source: bus-source
        target: /bus
        read_only: true
    networks:
      - factory

  # -------------------------------------------------------------------------
  # IS THE BUS READY, WHICHEVER BUS IT IS — a one-shot that is in the project in
  # BOTH modes and is every other service's ONLY bus dependency.
  # (26 September 2026, build item E1.)
  #
  # WHY IT EXISTS. Until today four services waited on 'nats-provision'
  # finishing. That is the right wait in local mode and an impossible one in
  # external mode, where the provisioner is not in the project at all — and
  # Compose does not shrug at that: a service that depends on a service whose
  # profile is off makes Compose REFUSE THE WHOLE PROJECT ("service X depends on
  # undefined service Y: invalid compose project"). Checked on this machine's
  # Compose (v5.2.0) with the Docker socket pointed at a path that does not
  # exist, so nothing was started. Making the dependency merely "not required"
  # does not help either: that setting says what to do when a dependency is
  # UNAVAILABLE, and it does not take a service out of what 'up' starts.
  #
  # So the dependency is REPLACED rather than weakened. This one-shot is present
  # in both modes, every service that needs the bus waits for THIS, and the
  # external-mode overlay clears this service's own dependency on the profiled-off
  # provisioner (depends_on: !reset {}) — which is necessary, not tidiness.
  #
  # WHAT IT DOES, in both modes: waits for the bus to answer its own monitoring
  # HEALTH route at the address the env file gives. In LOCAL mode that is all,
  # because it waits for the provisioner as well and the provisioner is what made
  # the storage. In EXTERNAL mode it then COMPARES the running bus, field by
  # field, against the pinned definitions on the read-only bus-source volume, and
  # exits non-zero if anything is missing, differs, or cannot be read — so the
  # coordinator never starts against a bus this release does not recognise.
  #
  # IT WRITES NOTHING TO THE BUS IN EITHER MODE. The comparison is a read of the
  # bus's own monitoring route, which takes no credential, against files mounted
  # read-only. A difference between a running bus and the pinned definitions is
  # settled before a rollout, not during one.
  # -------------------------------------------------------------------------
  bus-ready:
    image: ${NATS_PROVISION_IMAGE:?name the provisioning image in the env file - built by ./build-estate-images.sh}
    restart: "no"
    depends_on:
      # LOCAL MODE ONLY. The external-mode overlay resets this line, because the
      # provisioner is not in the project there and Compose refuses a project
      # that names a service whose profile is off.
      nats-provision:
        condition: service_completed_successfully
    environment:
      BUS_MODE: ${BUS_MODE:-local}
      # THE MONITORING ADDRESS, plain, and NEVER with a credential in it: that
      # route takes none. In local mode it is the bus service's own name; in
      # external mode it is the retained bus's name on the retained network.
      BUS_MONITORING_ADDRESS: ${BUS_MONITORING_ADDRESS:?name the bus's monitoring address in the env file, e.g. nats:8222 - a name and a port, with no credential in it}
      BUS_READY_TIMEOUT_S: ${BUS_READY_TIMEOUT_S:-90}
      # The account the comparison reads (the third E1/E2 review, 26 September
      # 2026: the setting existed in the env file and never reached the one
      # container that reads it, so the remedy its own refusal named did nothing).
      BUS_STREAMS_ACCOUNT: ${BUS_STREAMS_ACCOUNT:-}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        case "$${BUS_MODE}" in
          local|external) ;;
          *)
            echo "BUS_MODE is '$${BUS_MODE}' and it has to say local or external. Local means this bundle starts its own bus; external means the bus is already running and belongs to somebody else. deploy/estate/README.md says when each is used." >&2
            exit 1
            ;;
        esac
        case "$${BUS_MONITORING_ADDRESS}" in
          *@*)
            echo "the bus's monitoring address carries a credential. That route takes none, and this container prints the address, so give it plainly in the env file as a name and a port." >&2
            exit 1
            ;;
        esac
        deadline=$$(( $$(date +%s) + BUS_READY_TIMEOUT_S ))
        until curl -sf --max-time 5 "http://$${BUS_MONITORING_ADDRESS}/healthz" >/dev/null 2>&1; do
            if [ "$$(date +%s)" -ge "$${deadline}" ]; then
                echo "the bus did not answer its monitoring health route at http://$${BUS_MONITORING_ADDRESS}/healthz within $${BUS_READY_TIMEOUT_S}s. In external bus mode this usually means BUS_EXTERNAL_NETWORK does not name the network the bus is really on, or BUS_MONITORING_ADDRESS does not name it on that network." >&2
                exit 1
            fi
            sleep 2
        done
        echo "the bus answers its monitoring health route at http://$${BUS_MONITORING_ADDRESS}/healthz"
        if [ "$${BUS_MODE}" = "local" ]; then
            echo "local bus mode: this estate's own bus, and its storage was provisioned by the one-shot this waited for. Nothing was written to the bus here."
            exit 0
        fi
        echo "external bus mode: this bus is already running and is not this estate's to change. Comparing it with the pinned definitions, read-only — nothing here writes to the bus, and the mutating provisioner is not in this project at all."
        exec /usr/local/bin/compare-bus-with-definitions.sh \
            --monitoring-address "$${BUS_MONITORING_ADDRESS}" \
            --definitions /bus
    volumes:
      # THE PINNED DEFINITIONS, read-only, from the same volume and the same
      # commit the provisioner reads its scripts from. The comparison has to
      # read what the RELEASE pins, not what a machine has lying about.
      - type: volume
        source: bus-source
        target: /bus
        read_only: true
    networks:
      - factory

  # -------------------------------------------------------------------------
  # MEMORY — what the factory remembers between sessions and between builds.
  #
  # TWO CONTAINERS, ONE JOB. 'memory' answers questions (it is the memory
  # repository's resident MCP service); 'memory-relay' listens on the bus and
  # writes what it hears into the store. They are two services because they do
  # two different things at two different times, which is how the memory
  # repository has always run them.
  #
  # WHAT CHANGED HERE, on 25 September 2026 (stage 4b). Both ran on the HOST'S
  # OWN NETWORK, and the relay bound a folder under somebody's home directory
  # (~/.local/state/fleet-memory). The design's inventory row says what that
  # was: habit — "the folder should be a declared volume, the network a
  # declared network". So: the factory network, a named volume, and every
  # address a name.
  #
  # WHAT IS NOT HERE. The database and the embedding service. Both are outside
  # the estate today — on another machine — and both are an ADDRESS. The design
  # leaves where the database should live as an open question, and this bundle
  # does not answer it: it names the address and says so. README.md says the
  # same in longer words.
  #
  # THE DATABASE ADDRESS IS A SECRET, because it carries the password in it. It
  # arrives the same way the bus's eight account passwords do — as a FILE under
  # /run/secrets, read from the environment the command was run in — and a
  # small wrapper puts it into the environment of the service's own PROCESS and
  # nothing else. It is never in a container's declared environment, where
  # 'docker inspect' shows it to anybody who can reach the Docker daemon, and
  # it is never in any file in this bundle. That is a deliberate choice against
  # the easier one: the coordinator's own bus address still carries a password
  # in its environment (README.md's precondition 8), and nothing here repeats
  # that mistake.
  #
  # NAMING AN ENTRYPOINT EMPTIES THE IMAGE'S OWN COMMAND, so each service
  # writes its command out below. A release proof holds those two lines to what
  # the two images really say (../../scripts/verify-fleet-memory-image.sh), the
  # same guard the bus got on 24 September 2026.
  # -------------------------------------------------------------------------
  memory:
    image: ${FLEET_MEMORY_MCP_IMAGE:?name the memory service's image in the env file, e.g. FLEET_MEMORY_MCP_IMAGE=fleet-memory-mcp:2026.09.26-3 - built by ../../scripts/build-release-image.sh with the rest of the release}
    restart: unless-stopped
    # Every '$$' below is a dollar sign for the SHELL, escaped so that compose
    # leaves it alone. The last item is the shell's $0; the command below
    # follows it and is what "$@" hands on.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        address_file=/run/secrets/memory_database_address
        if [ ! -s "$$address_file" ]; then
            echo "the memory service was given no database address: the estate passes it in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says, with the value passed in from a child process." >&2
            exit 1
        fi
        FLEET_MEMORY_PG_DSN="$$(cat "$$address_file")"
        export FLEET_MEMORY_PG_DSN
        # ONE MEMORY DOOR PER SANDBOX (one sandbox per project, 17 October
        # 2026). With FLEET_MEMORY_SANDBOX_DOORS in the env file the process
        # opens one narrow door per entry ("<port>:<project>|<project>,..."),
        # each serving only its own projects, and the single door setting is
        # taken away (fleet-memory refuses both). The shared sandbox's door
        # stays 8006, published where it always was; every other door listens
        # on the port it is published on (31850 + the sandbox's slot), and
        # FLEET_MEMORY_SANDBOX_DOOR_PORTS, the port or range compose publishes
        # them on, must name exactly those ports. Each is added to the names
        # the service answers to. Unset: today's one door on 8006.
        refuse_the_doors() {
            echo "the memory service's doors will not do: $$1 (deploy/estate/.env.example, FLEET_MEMORY_SANDBOX_DOORS)." >&2
            exit 1
        }
        a_port() {
            case "$$1" in ""|0*|*[!0-9]*|??????*) return 1 ;; esac
            [ "$$1" -ge 1024 ] && [ "$$1" -le 65535 ]
        }
        the_door_ports() {
            # Every door's port but the shared sandbox's 8006, one per line.
            old_ifs="$$IFS"; IFS=,; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            for entry in "$$@"; do
                port="$${entry%%:*}"; port="$$(printf '%s' "$$port" | tr -d '[:space:]')"
                a_port "$$port" || refuse_the_doors "an entry's port is not a number from 1024 to 65535"
                [ "$$port" = 8006 ] || echo "$$port"
            done
        }
        the_published_ports() {
            case "$$1" in
                *-*) first="$${1%-*}"; last="$${1#*-}" ;;
                *) first="$$1"; last="$$1" ;;
            esac
            a_port "$$first" && a_port "$$last" && [ "$$first" -le "$$last" ] \
                || refuse_the_doors "FLEET_MEMORY_SANDBOX_DOOR_PORTS is not one port or one range first-last"
            port="$$first"
            while [ "$$port" -le "$$last" ]; do echo "$$port"; port=$$((port + 1)); done
        }
        doors="$${FLEET_MEMORY_MCP_SANDBOX_DOORS:-}"
        published="$${FACTORY_MEMORY_DOOR_PORTS:-}"
        unset FACTORY_MEMORY_DOOR_PORTS
        if [ -z "$$doors" ]; then
            unset FLEET_MEMORY_MCP_SANDBOX_DOORS
            [ -z "$$published" ] || refuse_the_doors "FLEET_MEMORY_SANDBOX_DOOR_PORTS is set and FLEET_MEMORY_SANDBOX_DOORS is not"
        else
            unset FLEET_MEMORY_MCP_SANDBOX_PORT
            # Each list is checked once in this shell (where a refusal stops
            # the service), then read.
            the_door_ports "$$doors" >/dev/null
            own="$$(the_door_ports "$$doors" | sort -n | tr '\n' ' ')"
            listed=""
            if [ -n "$$published" ]; then
                the_published_ports "$$published" >/dev/null
                listed="$$(the_published_ports "$$published" | sort -n | tr '\n' ' ')"
            fi
            [ "$$own" = "$$listed" ] || refuse_the_doors "the doors other than 8006 listen on ($$own) and FLEET_MEMORY_SANDBOX_DOOR_PORTS publishes ($$listed); each door is published on its own port, so the two must name the same ports"
            for port in $$own; do
                FLEET_MEMORY_MCP_ALLOWED_HOSTS="$$FLEET_MEMORY_MCP_ALLOWED_HOSTS,$$FACTORY_MEMORY_DOOR_ADDRESS:$$port"
            done
            export FLEET_MEMORY_MCP_ALLOWED_HOSTS
        fi
        unset FACTORY_MEMORY_DOOR_ADDRESS
        exec "$$@"
      - the-estate-hands-memory-its-database-address-as-a-file
    command: ["python", "-m", "fleet_memory.mcp"]
    environment:
      # HOW IT SERVES. The transport and the address INSIDE this container: the
      # published port below carries traffic to the container's own address,
      # and something bound to the container's loopback would never hear it.
      FLEET_MEMORY_MCP_TRANSPORT: http
      FLEET_MEMORY_MCP_HOST: 0.0.0.0
      FLEET_MEMORY_MCP_PORT: "8005"
      # THE SANDBOX'S NARROW DOOR (15 October 2026), a second port of this same
      # process over the same store. It offers the two searches and a write
      # that takes only build outcomes which replace nothing, off the
      # factory's own shelves. The sandbox reaches this port, not 8005.
      FLEET_MEMORY_MCP_SANDBOX_PORT: "8006"
      # ONE DOOR PER SANDBOX (17 October 2026), when the env file names them;
      # the entry shell above then takes the single door setting away, checks
      # the published ports and adds each door's address to the names below.
      FLEET_MEMORY_MCP_SANDBOX_DOORS: ${FLEET_MEMORY_SANDBOX_DOORS:-}
      FACTORY_MEMORY_DOOR_PORTS: ${FLEET_MEMORY_SANDBOX_DOOR_PORTS:-}
      FACTORY_MEMORY_DOOR_ADDRESS: ${FACTORY_GATEWAY_ADDRESS}
      # WHICH NAMES CALLERS MAY USE. The transport checks the Host header, so
      # every name this service is reached by has to be listed: the service
      # name on the factory network, and the gateway address a sandbox uses.
      # The env file builds both out of names; the narrow door's address is
      # added here.
      FLEET_MEMORY_MCP_ALLOWED_HOSTS: ${FLEET_MEMORY_ALLOWED_HOSTS:?name the host names the memory service answers to in the env file - its service name and the gateway address, both with their ports},${FACTORY_GATEWAY_ADDRESS}:${FLEET_MEMORY_SANDBOX_PORT:?name the port the sandbox's narrow memory door is published on in the env file}
      # THE EMBEDDING SERVICE — an address, outside this estate.
      FLEET_MEMORY_EMBED_URL: ${FLEET_MEMORY_EMBED_URL:?name the embedding service's address in the env file}
      FLEET_MEMORY_EMBED_MODEL: ${FLEET_MEMORY_EMBED_MODEL:?name the embedding model in the env file}
      FLEET_MEMORY_EMBED_DIMS: ${FLEET_MEMORY_EMBED_DIMS:?name how many dimensions that model returns in the env file}
      FLEET_MEMORY_EMBED_TIMEOUT_S: ${FLEET_MEMORY_EMBED_TIMEOUT_S:?name the embedding timeout in seconds in the env file}
    secrets:
      - source: memory-database-address
        target: memory_database_address
    networks:
      - factory
    ports:
      # THE THIRD PUBLISHED PORT IN THE ESTATE (and the fourth, the narrow
      # door below, since 15 October 2026), for the same reason as the other
      # two: a sandbox is a separate small machine that
      # cannot reach a service name, and section 7 of the design says a sandbox
      # reaches the memory service at the factory gateway address. Everything
      # inside the estate reaches it at the service name instead.
      #
      # The per-route refusal rule (this listener, this port, this allowed
      # source, refused to everything else including the local network) is NOT
      # enforced by this bundle yet. README.md lists it as a rollout
      # precondition, and until it is, the gateway address must be a private
      # address of this machine.
      - "${FACTORY_GATEWAY_ADDRESS:?name this machine's factory gateway address in the env file}:${FLEET_MEMORY_PORT:?name the port the memory service is published on in the env file}:8005"
      # The sandbox's narrow door (15 October 2026). Since then the port above
      # is for this machine's own tools; the machine's guard admits only the
      # sandbox's machine to this one, and no longer to the one above.
      - "${FACTORY_GATEWAY_ADDRESS}:${FLEET_MEMORY_SANDBOX_PORT}:8006"
      # One door per sandbox (17 October 2026): every door but the shared
      # sandbox's, each on the port it listens on (31850 + the sandbox's slot),
      # as one port or one range. Unset, this line says the line above again,
      # which compose counts once.
      - "${FACTORY_GATEWAY_ADDRESS}:${FLEET_MEMORY_SANDBOX_DOOR_PORTS:-${FLEET_MEMORY_SANDBOX_PORT}}:${FLEET_MEMORY_SANDBOX_DOOR_PORTS:-8006}"
    healthcheck:
      # Any HTTP answer proves the server is up; a refused connection is the
      # failure. This is the memory repository's own probe, asked of both
      # doors, and it uses the interpreter because the image has no curl.
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request, urllib.error, sys
          doors = os.environ.get("FLEET_MEMORY_MCP_SANDBOX_DOORS", "").strip()
          ports = [8005] + (
              [int(entry.split(":", 1)[0]) for entry in doors.split(",") if entry.strip()]
              if doors else [8006]
          )
          for port in ports:
              try:
                  urllib.request.urlopen(f"http://localhost:{port}/mcp/", timeout=5)
              except urllib.error.HTTPError:
                  pass
              except Exception:
                  sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # -------------------------------------------------------------------------
  # THE MODEL DOOR (14 October 2026) — how a project's sandbox reaches the
  # model router without holding a key.
  #
  # The sandbox used to be given a model-router key, and anything a build runs
  # in there can read whatever its containers are given. Now its containers
  # get a fixed placeholder, and this small proxy, at the gateway address,
  # replaces the caller's key with its own and passes the call to the router.
  # Its settings are model-door.cfg, beside this file, bound read-only.
  #
  # THE HOST'S NETWORK, AND WHY THIS ONE SERVICE IS ON IT. The model router
  # listens on this machine and a guard refuses Docker's bridges on its port,
  # so the door reaches it on the loopback, which only the host's network
  # has. It binds only the gateway address and its own port (MODEL_DOOR_PORT),
  # and the machine's guard admits only the sandbox's machine to that port.
  # It publishes nothing and joins no Compose network.
  #
  # ITS KEY IS A FILE, the same way the memory service's database address is:
  # read from the environment the command was run in, handed to the container
  # under /run/secrets, and put into the environment of HAProxy's own process
  # by the entry shell below. It is in no declared setting, so 'docker
  # inspect' does not show it, and it is in no file in this bundle.
  #
  # The image is the stock HAProxy the feature router is built from, pinned by
  # digest (estate-pins.conf). It runs as the image's own unprivileged user,
  # with every capability dropped and no way to gain one: it binds a port
  # above 1024 and writes nothing.
  #
  # WHY IT IS NOT MARKED read_only (found by starting it, 14 October 2026).
  # Compose hands a secret read from the environment into a container by
  # copying it in, and it refuses to do that for a read-only service ("`file`
  # is the sole supported option"), so a read-only door could not be given its
  # key the way every other estate secret is given. What that costs is small:
  # the image's user can write only in /tmp and /var/tmp (checked on the
  # pinned image), HAProxy writes nothing, and it runs no code but its own.
  # -------------------------------------------------------------------------
  model-door:
    image: ${FACTORY_MODEL_DOOR_IMAGE:?name the model door's image in the env file, pinned by digest - estate-pins.conf says which}
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # WHERE IT LISTENS: one specific address and a port, never every address of
        # the machine. MODEL_DOOR_BIND is parsed, not matched as text: an IPv4
        # address must be four numbers of 0 to 255, an IPv6 address must be in
        # brackets with at most eight groups of hex, and an address that works out
        # to "unspecified" (0.0.0.0, ::, and every other spelling of them) or to the
        # IPv4 broadcast address is refused.
        refuse_the_address() {
            echo "the model door listens only on one specific address and port, and MODEL_DOOR_BIND ($$MODEL_DOOR_BIND) is not one: $$1. Set FACTORY_GATEWAY_ADDRESS and MODEL_DOOR_PORT in the env file (deploy/estate/README.md, 'The model door')." >&2
            exit 1
        }
        an_ipv4_address() {
            case "$$1" in ""|*[!0-9.]*|.*|*.|*..*) return 1 ;; esac
            old_ifs="$$IFS"; IFS=.; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            [ "$$#" -eq 4 ] || return 1
            total=0; all_full=1
            for part in "$$@"; do
                case "$$part" in 0) ;; 0*|????*) return 1 ;; esac
                [ "$$part" -le 255 ] || return 1
                total=$$((total + part))
                [ "$$part" -eq 255 ] || all_full=0
            done
            [ "$$total" -gt 0 ] || refuse_the_address "it is the unspecified address, which means every IPv4 address"
            [ "$$all_full" -eq 0 ] || refuse_the_address "it is the IPv4 broadcast address"
            return 0
        }
        some_ipv6_groups() {
            # Prints how many groups of one to four hex digits $$1 holds, or fails.
            [ -n "$$1" ] || { echo 0; return 0; }
            case "$$1" in :*|*:|*::*) return 1 ;; esac
            old_ifs="$$IFS"; IFS=:; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            for group in "$$@"; do
                case "$$group" in ""|?????*|*[!0-9a-fA-F]*) return 1 ;; esac
            done
            echo "$$#"
        }
        an_ipv6_address() {
            case "$$1" in ""|*[!0-9a-fA-F:]*|*::*::*) return 1 ;; esac
            case "$$1" in
                *::*)
                    left="$$(some_ipv6_groups "$${1%%::*}")" || return 1
                    right="$$(some_ipv6_groups "$${1#*::}")" || return 1
                    [ $$((left + right)) -le 7 ] || return 1
                    ;;
                *)
                    groups="$$(some_ipv6_groups "$$1")" || return 1
                    [ "$$groups" -eq 8 ] || return 1
                    ;;
            esac
            # Every group zero, however it is spelt, is the unspecified address.
            nonzero="$$(printf '%s' "$$1" | tr -d ':0')"
            [ -n "$$nonzero" ] || refuse_the_address "it is the unspecified address, which means every IPv6 address"
            return 0
        }
        bind="$$MODEL_DOOR_BIND"
        case "$$bind" in
            \[*\]:*)
                host="$${bind%%]:*}"; host="$${host#\[}"; port="$${bind##*]:}"
                [ "$$bind" = "[$$host]:$$port" ] || refuse_the_address "it is not one [address]:port"
                an_ipv6_address "$$host" || refuse_the_address "the part in brackets is not one IPv6 address"
                ;;
            *:*:*)
                refuse_the_address "an IPv6 address must be written in brackets, as [address]:port"
                ;;
            *:*)
                host="$${bind%:*}"; port="$${bind##*:}"
                an_ipv4_address "$$host" || refuse_the_address "the part before the port is not one IPv4 address"
                ;;
            *)
                refuse_the_address "it has no port"
                ;;
        esac
        case "$$port" in ""|0*|*[!0-9]*|??????*) refuse_the_address "the port is not a number from 1 to 65535" ;; esac
        [ "$$port" -le 65535 ] || refuse_the_address "the port is not a number from 1 to 65535"
        key_file=/run/secrets/sandbox_model_key
        if [ ! -s "$$key_file" ]; then
            echo "the model door was given no key: the estate passes it in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says ('The model door'), with SANDBOX_MODEL_KEY passed in from a child process." >&2
            exit 1
        fi
        MODEL_DOOR_KEY="$$(cat "$$key_file")"
        # A file holding only a newline or spaces is no key, and a key with
        # whitespace in it is a broken one. Either would start a door that
        # sends an empty or broken key and fails every model call later.
        if [ -z "$$MODEL_DOOR_KEY" ] || [ "$$(printf '%s' "$$MODEL_DOOR_KEY" | tr -d '[:space:]')" != "$$MODEL_DOOR_KEY" ]; then
            echo "the model door's key file holds no usable key (it is blank, or has spaces or line breaks in it). Mint the key again and pass it in as SANDBOX_MODEL_KEY, the way deploy/estate/README.md says ('The model door')." >&2
            exit 1
        fi
        export MODEL_DOOR_KEY
        exec "$$@"
      - the-estate-hands-the-model-door-its-key-as-a-file
    command: ["haproxy", "-db", "-f", "/usr/local/etc/haproxy/model-door.cfg"]
    environment:
      # Where it listens: BUILT here from the gateway address and the door's
      # port, as every other gateway service's address is, so it cannot be
      # set to every address of the machine by hand. The entry shell above
      # also parses it and refuses anything but one specific address.
      MODEL_DOOR_BIND: ${FACTORY_GATEWAY_ADDRESS:?name this machine's factory gateway address in the env file}:${MODEL_DOOR_PORT:?name the port the model door listens on at the gateway address in the env file}
    secrets:
      - source: sandbox-model-key
        target: sandbox_model_key
    volumes:
      - type: bind
        source: ./model-door.cfg
        target: /usr/local/etc/haproxy/model-door.cfg
        read_only: true
        bind:
          create_host_path: false

  # -------------------------------------------------------------------------
  # THE GIT DOOR (17 October 2026) — how a project's sandbox reads a PRIVATE
  # repository without holding a key. Design "Building production features
  # from a signed-off prototype", section 2.8.
  #
  # The sandbox fetches every project itself, over https and with no
  # credential, so until now it could read public repositories only. This
  # door, at the gateway address, takes git's two READ requests for a
  # repository named in its allow-list, adds a read-only GitHub token of its
  # own, and passes them to github.com over verified TLS. Everything else is
  # refused with 403, a push (git-receive-pack) included, and so is every
  # repository that is not on the list. Its settings are git-door.cfg, beside
  # this file, bound read-only.
  #
  # ITS TWO INPUTS, and nothing else of this machine:
  #   * the token, GIT_DOOR_TOKEN: a fine-grained GitHub token with Contents
  #     and Metadata read-only. A secret FILE, read from the environment the
  #     command was run in, exactly as the model door's key is; the entry
  #     shell below builds the Basic header from it for HAProxy's own process.
  #     It is in no declared setting, so 'docker inspect' does not show it, and
  #     it is in no file in this bundle;
  #   * the allow-list, one owner/name per line, in the file the env file's
  #     GIT_DOOR_REPOS_FILE names, bound read-only. It names private
  #     repositories, so it lives with the machine's settings, never here.
  #
  # IT IS BEHIND A PROFILE, 'git-door', so 'docker compose up' leaves it alone
  # until a machine adds 'git-door' to COMPOSE_PROFILES in its env file (not
  # '--profile' on the command line, which REPLACES the env file's profiles).
  # Its settings use ':-' rather than ':?' for the same reason: a ':?' stops
  # the WHOLE file rendering even while the profile is off, which would stop
  # an env file without these lines from starting anything. The entry shell
  # refuses to start the door without each of them instead.
  #
  # The rest is the model door's: the host's network (it binds only the
  # gateway address and its own port, and the machine's guard admits only the
  # sandbox's machine to it), the same stock HAProxy image pinned by digest,
  # the image's own unprivileged user, every capability dropped and no way to
  # gain one, and not read-only, because Compose cannot copy a secret read
  # from the environment into a read-only service.
  # -------------------------------------------------------------------------
  git-door:
    profiles: ["git-door"]
    image: ${FACTORY_GIT_DOOR_IMAGE:-}
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # WHERE IT LISTENS: one specific address and one port per sandbox
        # ("<address>:<port>,<port>", one sandbox per project, 17 October
        # 2026), never every address of the machine. GIT_DOOR_BIND is parsed
        # (the same parsing as the model door's), not matched as text: an IPv4
        # address must be four numbers of 0 to 255, an IPv6 address must be in
        # brackets with at most eight groups of hex, and an address that works out
        # to "unspecified" (0.0.0.0, ::, and every other spelling of them) or to the
        # IPv4 broadcast address is refused.
        refuse_the_address() {
            echo "the Git door listens only on one specific address and port, and GIT_DOOR_BIND ($$GIT_DOOR_BIND) is not one: $$1. Set FACTORY_GATEWAY_ADDRESS and GIT_DOOR_PORT in the env file (deploy/estate/README.md, 'The Git door')." >&2
            exit 1
        }
        an_ipv4_address() {
            case "$$1" in ""|*[!0-9.]*|.*|*.|*..*) return 1 ;; esac
            old_ifs="$$IFS"; IFS=.; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            [ "$$#" -eq 4 ] || return 1
            total=0; all_full=1
            for part in "$$@"; do
                case "$$part" in 0) ;; 0*|????*) return 1 ;; esac
                [ "$$part" -le 255 ] || return 1
                total=$$((total + part))
                [ "$$part" -eq 255 ] || all_full=0
            done
            [ "$$total" -gt 0 ] || refuse_the_address "it is the unspecified address, which means every IPv4 address"
            [ "$$all_full" -eq 0 ] || refuse_the_address "it is the IPv4 broadcast address"
            return 0
        }
        some_ipv6_groups() {
            # Prints how many groups of one to four hex digits $$1 holds, or fails.
            [ -n "$$1" ] || { echo 0; return 0; }
            case "$$1" in :*|*:|*::*) return 1 ;; esac
            old_ifs="$$IFS"; IFS=:; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            for group in "$$@"; do
                case "$$group" in ""|?????*|*[!0-9a-fA-F]*) return 1 ;; esac
            done
            echo "$$#"
        }
        an_ipv6_address() {
            case "$$1" in ""|*[!0-9a-fA-F:]*|*::*::*) return 1 ;; esac
            case "$$1" in
                *::*)
                    left="$$(some_ipv6_groups "$${1%%::*}")" || return 1
                    right="$$(some_ipv6_groups "$${1#*::}")" || return 1
                    [ $$((left + right)) -le 7 ] || return 1
                    ;;
                *)
                    groups="$$(some_ipv6_groups "$$1")" || return 1
                    [ "$$groups" -eq 8 ] || return 1
                    ;;
            esac
            # Every group zero, however it is spelt, is the unspecified address.
            nonzero="$$(printf '%s' "$$1" | tr -d ':0')"
            [ -n "$$nonzero" ] || refuse_the_address "it is the unspecified address, which means every IPv6 address"
            return 0
        }
        # Each sandbox's port, from the comma-separated list after the address:
        # every one a number from 1 to 65535 written plainly, none twice. HAProxy
        # is given "<address>:<port>,<address>:<port>" as GIT_DOOR_LISTEN, and
        # PORTS keeps the list for the allow-list's check below.
        the_ports() {
            case "$$1" in ""|,*|*,|*,,*) refuse_the_address "the ports after the address are not a comma-separated list of numbers" ;; esac
            old_ifs="$$IFS"; IFS=,; set -f; set -- $$1; set +f; IFS="$$old_ifs"
            PORTS=""; GIT_DOOR_LISTEN=""
            for port in "$$@"; do
                case "$$port" in ""|0*|*[!0-9]*|??????*) refuse_the_address "a port is not a number from 1 to 65535" ;; esac
                [ "$$port" -le 65535 ] || refuse_the_address "a port is not a number from 1 to 65535"
                case ",$$PORTS," in *",$$port,"*) refuse_the_address "the port $$port is named twice" ;; esac
                PORTS="$${PORTS:+$$PORTS,}$$port"
                GIT_DOOR_LISTEN="$${GIT_DOOR_LISTEN:+$$GIT_DOOR_LISTEN,}$$shown:$$port"
            done
        }
        bind="$$GIT_DOOR_BIND"
        case "$$bind" in
            \[*\]:*)
                host="$${bind%%]:*}"; host="$${host#\[}"; ports="$${bind##*]:}"
                [ "$$bind" = "[$$host]:$$ports" ] || refuse_the_address "it is not one [address]:port"
                an_ipv6_address "$$host" || refuse_the_address "the part in brackets is not one IPv6 address"
                shown="[$$host]"
                ;;
            *:*:*)
                refuse_the_address "an IPv6 address must be written in brackets, as [address]:port"
                ;;
            *:*)
                host="$${bind%:*}"; ports="$${bind##*:}"
                an_ipv4_address "$$host" || refuse_the_address "the part before the port is not one IPv4 address"
                shown="$$host"
                ;;
            *)
                refuse_the_address "it has no port"
                ;;
        esac
        [ -n "$$ports" ] || refuse_the_address "it has no port"
        the_ports "$$ports"
        export GIT_DOOR_LISTEN
        token_file=/run/secrets/git_door_token
        if [ ! -s "$$token_file" ]; then
            echo "the Git door was given no token: the estate passes it in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says ('The Git door'), with GIT_DOOR_TOKEN passed in from a child process." >&2
            exit 1
        fi
        token="$$(cat "$$token_file")"
        if [ -z "$$token" ] || [ "$$(printf '%s' "$$token" | tr -d '[:space:]')" != "$$token" ]; then
            echo "the Git door's token file holds no usable token (it is blank, or has spaces or line breaks in it). Make the token again and pass it in as GIT_DOOR_TOKEN, the way deploy/estate/README.md says ('The Git door')." >&2
            exit 1
        fi
        # THE ALLOW-LIST: a file, one <port>/<owner>/<name> per line, the port
        # being that of the one sandbox that may read the repository; blank
        # lines and lines starting with # are left out. Anything else on a
        # line stops the door, and so do a port the door does not listen on,
        # a repository listed for two ports, and a list with no repository.
        repos=/usr/local/etc/haproxy/git-door.repos
        if [ ! -f "$$repos" ] || [ ! -r "$$repos" ]; then
            echo "the Git door has no allow-list: GIT_DOOR_REPOS_FILE in the env file must name a readable file of <port>/<owner>/<name> lines (deploy/estate/README.md, 'The Git door')." >&2
            exit 1
        fi
        line='^[1-9][0-9]{0,4}/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$$'
        if grep -v -E "^[[:space:]]*$$|^#|$$line" "$$repos" >/dev/null; then
            echo "the Git door's allow-list has a line that is not <port>/<owner>/<name> (the port of the repository's own sandbox, then the repository; one per line, # for a comment)." >&2
            exit 1
        fi
        if ! grep -q -E "$$line" "$$repos"; then
            echo "the Git door's allow-list names no repository, so there is nothing it may read." >&2
            exit 1
        fi
        for listed_port in $$(grep -E "$$line" "$$repos" | cut -d/ -f1 | sort -u); do
            case ",$$PORTS," in
                *",$$listed_port,"*) ;;
                *) echo "the Git door's allow-list names the port $$listed_port, which the door does not listen on (GIT_DOOR_PORTS in the env file)." >&2; exit 1 ;;
            esac
        done
        twice="$$(grep -E "$$line" "$$repos" | cut -d/ -f2- | tr 'A-Z' 'a-z' | sort | uniq -d | head -n 1)"
        if [ -n "$$twice" ]; then
            echo "the Git door's allow-list lists $$twice for more than one port; a repository is read by its own sandbox only." >&2
            exit 1
        fi
        # GitHub takes a token as the password of Basic authentication, with
        # x-access-token as the user. Built here, for HAProxy's own process.
        GIT_DOOR_BASIC="$$(printf 'x-access-token:%s' "$$token" | base64 | tr -d '\n')"
        unset token
        export GIT_DOOR_BASIC
        exec "$$@"
      - the-estate-hands-the-git-door-its-token-as-a-file
    command: ["haproxy", "-db", "-f", "/usr/local/etc/haproxy/git-door.cfg"]
    environment:
      # Where it listens: BUILT from the gateway address and the door's ports
      # (one per sandbox, comma-separated, GIT_DOOR_PORTS; the single
      # GIT_DOOR_PORT of before is still read when GIT_DOOR_PORTS is unset),
      # as the model door's is, and parsed again by the entry shell above.
      GIT_DOOR_BIND: ${FACTORY_GATEWAY_ADDRESS:?name this machine's factory gateway address in the env file}:${GIT_DOOR_PORTS:-${GIT_DOOR_PORT:-}}
    secrets:
      - source: git-door-token
        target: git_door_token
    volumes:
      - type: bind
        source: ./git-door.cfg
        target: /usr/local/etc/haproxy/git-door.cfg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GIT_DOOR_REPOS_FILE:-}
        target: /usr/local/etc/haproxy/git-door.repos
        read_only: true
        bind:
          create_host_path: false

  # -------------------------------------------------------------------------
  # THE MEMORY RELAY — it listens on the bus and writes what it hears into the
  # store. It PUBLISHES NOTHING: nothing outside the estate ever calls it, so
  # it has no port, and a sandbox cannot reach it at all.
  #
  # ITS STATE IS A NAMED VOLUME with one writer, which is this service. The
  # relay writes one small file after every message — when it started, when it
  # last wrote something, how many of each — because a clean ingest is
  # otherwise completely silent and a dead relay and a busy one look identical
  # from outside. That file used to land in a folder under somebody's home
  # directory; it now lands in 'memory-state', and its path inside the
  # container is a setting rather than a guess.
  #
  # ITS BUS PASSWORD NEVER ENTERS ITS ENVIRONMENT EITHER. The memory
  # repository's own compose file gives it a whole nats:// address with the
  # password in it; here the address and the account name are plain values and
  # the password arrives as a file, and the wrapper below builds the address
  # for the relay's own process.
  # -------------------------------------------------------------------------
  memory-relay:
    image: ${FLEET_MEMORY_RELAY_IMAGE:?name the memory relay's image in the env file, e.g. FLEET_MEMORY_RELAY_IMAGE=fleet-memory-relay:2026.09.26-3 - built by ../../scripts/build-release-image.sh with the rest of the release}
    restart: unless-stopped
    depends_on:
      # The relay BINDS the MEMORY stream rather than creating it, so the bus
      # has to hold that stream before the relay starts. In local mode the
      # one-shot makes it from the bus repository's own definitions; in external
      # mode the bus already holds it and 'bus-ready' has checked that it does.
      # Either way this waits for 'bus-ready', which is the one bus dependency
      # that exists in both modes (26 September 2026, build item E1).
      bus-ready:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        address_file=/run/secrets/memory_database_address
        if [ ! -s "$$address_file" ]; then
            echo "the memory relay was given no database address: the estate passes it in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says, with the value passed in from a child process." >&2
            exit 1
        fi
        FLEET_MEMORY_PG_DSN="$$(cat "$$address_file")"
        export FLEET_MEMORY_PG_DSN
        password_file=/run/secrets/memory_bus_password
        if [ ! -s "$$password_file" ]; then
            echo "the memory relay was given no bus password: the estate passes the memory account's password in as a file, and this one arrived missing or empty." >&2
            exit 1
        fi
        case "$$FLEET_MEMORY_BUS_ADDRESS" in
          *@*)
            echo "the memory relay's bus address carries a credential. Give the address and the account name plainly in the env file; the password comes in as a file, so it never reaches this container's declared environment." >&2
            exit 1
            ;;
        esac
        FLEET_MEMORY_NATS_URL="nats://$${FLEET_MEMORY_BUS_USER}:$$(cat "$$password_file")@$${FLEET_MEMORY_BUS_ADDRESS#nats://}"
        export FLEET_MEMORY_NATS_URL
        exec "$$@"
      - the-estate-hands-the-relay-its-addresses-as-files
    command: ["faststream", "run", "fleet_memory.app:app"]
    environment:
      # WHERE THE BUS IS, and AS WHOM — both plain, neither a secret. The
      # wrapper above builds the address the relay reads from these two and the
      # password file, and refuses an address that already carries a credential.
      FLEET_MEMORY_BUS_ADDRESS: ${FLEET_MEMORY_BUS_ADDRESS:?name the bus's address for the memory relay in the env file, e.g. nats://nats:4222 - a service name, with no credential in it}
      FLEET_MEMORY_BUS_USER: ${FLEET_MEMORY_BUS_USER:?name the bus account the memory relay connects as in the env file}
      # ITS PROGRESS MARKER, inside its own volume. A plain path in a container,
      # the same on every machine, and not a secret.
      FLEET_MEMORY_FENCE_RELAY_MARKER_PATH: /var/lib/fleet-memory/relay-progress.json
      FLEET_MEMORY_EMBED_URL: ${FLEET_MEMORY_EMBED_URL:?name the embedding service's address in the env file}
      FLEET_MEMORY_EMBED_MODEL: ${FLEET_MEMORY_EMBED_MODEL:?name the embedding model in the env file}
      FLEET_MEMORY_EMBED_DIMS: ${FLEET_MEMORY_EMBED_DIMS:?name how many dimensions that model returns in the env file}
      FLEET_MEMORY_EMBED_TIMEOUT_S: ${FLEET_MEMORY_EMBED_TIMEOUT_S:?name the embedding timeout in seconds in the env file}
      FLEET_MEMORY_ACK_WAIT_S: ${FLEET_MEMORY_ACK_WAIT_S:?name how long the bus waits for the relay to finish one message in the env file}
      FLEET_MEMORY_MAX_DELIVER: ${FLEET_MEMORY_MAX_DELIVER:?name how many delivery attempts a message gets before it is parked in the env file}
    secrets:
      - source: memory-database-address
        target: memory_database_address
      - source: bus-fleet-memory-password
        target: memory_bus_password
    volumes:
      # THE DESIGN'S TABLE CALLS THIS memory-state and names this service its
      # one writer. It replaces the bind of a folder under a home directory.
      - memory-state:/var/lib/fleet-memory
    networks:
      - factory
    healthcheck:
      # THE MARKER IS THE LIVENESS SIGNAL, which is what it was made for. The
      # relay writes it when it starts — after the store is open — and again
      # after every message, so a marker that exists says the relay got all the
      # way up. There is nothing to ask this service over a network: it listens
      # on the bus and answers nobody.
      test: ["CMD", "test", "-f", "/var/lib/fleet-memory/relay-progress.json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------------------------------------------------------------
  # THE SLACK FRONT DOOR — where Rich approves a spec, taps a build gate and
  # says merge. Added 25 September 2026, stage 4c.
  #
  # It ran as a host unit out of a checkout and a virtual environment under a
  # home directory, reading that checkout's own settings file. The design's
  # inventory calls that habit: the front door needs a bus, a model seat and a
  # Slack workspace, and not one of those is this machine.
  #
  # IT PUBLISHES NO PORT, AND THAT IS NOT AN OVERSIGHT. Slack pushes nothing to
  # this service: the repository's reply path is SOCKET MODE, an outbound
  # WebSocket this service dials to Slack
  # (src/jarvis/infrastructure/slack_reply.py). So there is nothing for Slack
  # to reach, no inbound route to open, and no public address or tunnel for
  # this machine to arrange. What the front door does serve over HTTP is its
  # own server, on the factory network, which is how the estate's own check
  # asks whether it is up.
  #
  # IT IS A DEVELOPMENT SERVER, said plainly. 'langgraph dev' is the langgraph
  # CLI's development server and it is exactly what the live host unit has
  # always started. This estate changes WHERE the front door runs, not WHAT
  # runs. The production alternative that CLI offers needs a licence key for a
  # closed-source server; none is baked and none is read. README.md carries
  # this as an open item for the front door's owner.
  #
  # ITS SLACK TOKENS ARRIVE AS FILES, and its bus password too — the same
  # mechanism the bus's own passwords and the memory store's address use. The
  # wrapper below puts them into the environment of the front door's own
  # PROCESS and nothing else, so they are not in this container's declared
  # environment where 'docker inspect' shows them to anybody who can reach the
  # Docker daemon.
  # -------------------------------------------------------------------------
  front-door:
    image: ${JARVIS_IMAGE:?name the jarvis image in the env file, e.g. JARVIS_IMAGE=jarvis:2026.09.26-3 - built by ../../scripts/build-release-image.sh with the rest of the release}
    restart: unless-stopped
    depends_on:
      # NOT because it touches the bus at start-up — it does not. Its two
      # graphs are imported when the server starts, but nothing in them
      # connects to anything until a message is handled: on all three stage 4c
      # runs the bus saw ONE jarvis connection, the gateway's, not two. The
      # dependency is still the right one — the first Slack message this
      # service handles wants the bus, and the streams have to be there by
      # then rather than being made underneath a running service.
      #
      # It waits for 'bus-ready' rather than for the provisioner, because that is
      # the one bus dependency that exists in both bus modes (26 September 2026,
      # build item E1).
      bus-ready:
        condition: service_completed_successfully
    # Every '$$' below is a dollar sign for the SHELL, escaped so that compose
    # leaves it alone. The last item is the shell's $0; the command below
    # follows it and is what "$@" hands on.
    entrypoint: &jarvis-entrypoint
      - /bin/sh
      - -c
      - |
        set -eu
        case "$$JARVIS_NATS_URL" in
          *@*)
            echo "this service's bus address carries a credential. Give the address and the account name plainly in the env file; the password comes in as a file, so it never reaches this container's declared environment." >&2
            exit 1
            ;;
        esac
        password_file=/run/secrets/jarvis_bus_password
        if [ ! -s "$$password_file" ]; then
            echo "this service was given no bus password: the estate passes the jarvis account's password in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says, with the value passed in from a child process." >&2
            exit 1
        fi
        JARVIS_NATS_PASSWORD="$$(cat "$$password_file")"
        export JARVIS_NATS_PASSWORD
        for pair in JARVIS_SLACK_BOT_TOKEN:/run/secrets/slack_bot_token \
                    JARVIS_SLACK_APP_TOKEN:/run/secrets/slack_app_token; do
            name="$${pair%%:*}"
            file="$${pair#*:}"
            if [ ! -s "$$file" ]; then
                echo "this service was given no value for $$name: the estate passes each Slack credential in as a file, and that one arrived missing or empty. deploy/estate/README.md says how the machine makes them." >&2
                exit 1
            fi
            eval "$$name=\"\$$(cat \"\$$file\")\"; export $$name"
        done
        # THE FRONT DOOR'S SAVED STATE HAS TO BE WRITABLE BEFORE THE SERVER
        # STARTS, and only the front door sets this name — the gateway keeps no
        # files, so this block is skipped for it. Nothing in the jarvis package
        # reads FRONT_DOOR_STATE_DIR; it is read here, by this wrapper.
        #
        # WHY IT IS ASKED AT ALL. The server creates that directory if it can
        # and then writes its threads into it, so a directory it cannot write is
        # not a start-up failure: the front door comes up, answers its health
        # route, takes Rich's approval and loses it. A fresh named volume comes
        # up root-owned unless the IMAGE has that directory owned by the
        # server's user, which jarvis images built before 26 September 2026 do
        # not — so this says which of those two it is, by name, rather than
        # leaving a silent data loss to be found later.
        if [ -n "$${FRONT_DOOR_STATE_DIR:-}" ]; then
            if [ ! -d "$$FRONT_DOOR_STATE_DIR" ]; then
                echo "the front door's saved threads belong in $$FRONT_DOOR_STATE_DIR and there is no such directory in this image. The estate mounts a volume there; a jarvis image that does not create it cannot be given one." >&2
                exit 1
            fi
            if ! touch "$$FRONT_DOOR_STATE_DIR/.writable" 2>/dev/null; then
                echo "the front door cannot write $$FRONT_DOOR_STATE_DIR, where its saved threads and checkpoints go, so it would answer its health route and then lose every approval. A fresh volume takes its ownership from the image: this needs a jarvis image whose own user owns that directory (built 26 September 2026 or later)." >&2
                exit 1
            fi
            rm -f "$$FRONT_DOOR_STATE_DIR/.writable"
        fi
        exec "$$@"
      - the-estate-hands-jarvis-its-credentials-as-files
    # The image's own CMD, written out because naming an entrypoint above
    # empties it. Its proof script holds these two together.
    command: ["langgraph", "dev", "--no-browser", "--host", "0.0.0.0", "--port", "2024"]
    environment:
      # WHERE THE BUS IS, and AS WHOM — both plain, neither a secret. The
      # wrapper above refuses an address that already carries a credential and
      # supplies the password from its file; this package reads the account
      # name and password separately, so no address here ever holds one.
      JARVIS_NATS_URL: ${JARVIS_NATS_URL:?name the bus's address for jarvis in the env file, e.g. nats://nats:4222 - a service name, with no credential in it}
      JARVIS_NATS_USER: ${JARVIS_NATS_USER:?name the bus account jarvis connects as in the env file}
      # AND UNDER WHAT NAME (26 September 2026, build item E3-j1).
      #
      # This service and the bus gateway are given the SAME account above,
      # deliberately. So "the bus holds a connection from the jarvis account" is
      # TRUE while the gateway is stopped and this one is running — and a health
      # check built on the account alone would call a dead gateway healthy. The
      # bus records the name a client sends for itself and reports it on its
      # monitoring route, so the name is how the two are told apart. It is a
      # label and not a credential: it admits nobody, and the bus prints it to
      # anyone who may read that route.
      #
      # BOTH NAMES COME FROM ONE SETTING so they cannot drift apart, and so that
      # two estates on one machine do not both call themselves the same thing.
      JARVIS_NATS_CLIENT_NAME: front-door-${FACTORY_INSTANCE:-factory}
      # THE MODEL SEAT, an address outside this estate, and the key the client
      # library insists on having before it will be constructed at all.
      JARVIS_LLAMA_SWAP_BASE_URL: ${JARVIS_MODEL_SEAT_URL:?name the model seat's address for jarvis in the env file}
      OPENAI_API_KEY: ${JARVIS_MODEL_SEAT_KEY:?name the model seat's key in the env file - a local seat takes any value and the client library refuses to be built without one}
      # WHICH SLACK CHANNELS AND WHICH PEOPLE. Channel and member ids, which
      # are names rather than credentials — they identify, they do not admit.
      JARVIS_SLACK_CHANNEL_ID: ${JARVIS_SLACK_CHANNEL_ID:?name the Slack channel the front door posts in, in the env file}
      JARVIS_SLACK_OPERATOR_USER_IDS: ${JARVIS_SLACK_OPERATOR_USER_IDS:?name the Slack member ids allowed to approve and merge, in the env file}
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
      # WHERE THIS SERVICE'S SAVED THREADS ARE, read by the wrapper above and by
      # nothing in the jarvis package. It is the same path as the volume mounted
      # below, written here so the wrapper can refuse an unwritable one before
      # the server starts. It is a path inside this image, the same on every
      # machine, and it names no machine and no person.
      FRONT_DOOR_STATE_DIR: /app/.langgraph_api
    # ITS SAVED THREADS SURVIVE BEING REPLACED (26 September 2026).
    #
    # Codex's review drove the actual release image: a thread created through
    # the front door's API survived stopping and starting the same container,
    # and was gone — 404 — from a replacement container built from the identical
    # image. Rich's approvals and merge words live in those threads, and
    # replacing a container is the ordinary way this estate takes a new release,
    # so that is a build's worth of conversation lost every upgrade.
    #
    # WHY /app/.langgraph_api AND NOT SOMEWHERE TIDIER. The development server
    # writes its threads, runs and checkpoints under the RELATIVE path
    # '.langgraph_api' in its working directory, and there is no setting or flag
    # for anywhere else. Its working directory has to stay /app, because
    # langgraph.json names its two graphs as ./src paths. So the volume goes
    # where the server already writes, rather than the code moving to suit it.
    #
    # ONE WRITER. This volume is the front door's alone — the gateway keeps no
    # files and mounts nothing, and two processes sharing one checkpoint
    # directory is a different and worse arrangement than each keeping its own.
    #
    # A FRESH VOLUME IS WRITABLE WITH NO HAND-OVER, because Docker fills one
    # from what the IMAGE has at the mount point, ownership included, and the
    # jarvis image creates that directory owned by the user it runs as. An image
    # built before 26 September 2026 does not, and the wrapper above says so by
    # name instead of letting the front door lose approvals quietly.
    volumes:
      - front-door-state:/app/.langgraph_api
    secrets:
      - source: bus-jarvis-password
        target: jarvis_bus_password
      - source: slack-bot-token
        target: slack_bot_token
      - source: slack-app-token
        target: slack_app_token
    networks:
      - factory
    healthcheck:
      # The server's own health route, asked on the container's own address.
      # The image has no curl, so the interpreter asks.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          try:
              urllib.request.urlopen("http://localhost:2024/ok", timeout=5)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # -------------------------------------------------------------------------
  # THE BUS GATEWAY — the same package's own command, carrying Slack traffic
  # onto the bus and the factory's answers back. Added 25 September 2026.
  #
  # SAME IMAGE, DIFFERENT START COMMAND, which is the shape the coordinator and
  # the answer service already have: one image per repository release, one
  # start line per service. It is given the same credentials as the front door,
  # as files, by the same wrapper — and the same ones the live host unit is
  # given today, which is a decrypt tool named by an absolute path in a unit
  # file.
  #
  # IT PUBLISHES NOTHING either. It talks to the bus and to Slack, both
  # outbound, and nothing in the estate or outside it calls it.
  #
  # IT REFUSES TO START WITHOUT THE BUS, by its own design, and that is worth
  # knowing when reading its log: this command treats the broker as a hard
  # dependency and exits non-zero rather than running on without one.
  # -------------------------------------------------------------------------
  bus-gateway:
    image: ${JARVIS_IMAGE:?name the jarvis image in the env file, e.g. JARVIS_IMAGE=jarvis:2026.09.26-3 - built by ../../scripts/build-release-image.sh with the rest of the release}
    restart: unless-stopped
    depends_on:
      # 'bus-ready', not the provisioner: the one bus dependency that exists in
      # both bus modes (26 September 2026, build item E1).
      bus-ready:
        condition: service_completed_successfully
    entrypoint: *jarvis-entrypoint
    command: ["jarvis", "serve-nats"]
    environment:
      JARVIS_NATS_URL: ${JARVIS_NATS_URL:?name the bus's address for jarvis in the env file, e.g. nats://nats:4222 - a service name, with no credential in it}
      JARVIS_NATS_USER: ${JARVIS_NATS_USER:?name the bus account jarvis connects as in the env file}
      # ITS OWN NAME ON THE BUS (26 September 2026, build item E3-j1). The same
      # setting the front door's name is built from, one word different, so the
      # two can never end up the same. This is the name the gateway watch below
      # looks for, and the account alone is not enough because the front door
      # shares it.
      JARVIS_NATS_CLIENT_NAME: bus-gateway-${FACTORY_INSTANCE:-factory}
      JARVIS_LLAMA_SWAP_BASE_URL: ${JARVIS_MODEL_SEAT_URL:?name the model seat's address for jarvis in the env file}
      OPENAI_API_KEY: ${JARVIS_MODEL_SEAT_KEY:?name the model seat's key in the env file - a local seat takes any value and the client library refuses to be built without one}
      JARVIS_SLACK_CHANNEL_ID: ${JARVIS_SLACK_CHANNEL_ID:?name the Slack channel the front door posts in, in the env file}
      JARVIS_SLACK_OPERATOR_USER_IDS: ${JARVIS_SLACK_OPERATOR_USER_IDS:?name the Slack member ids allowed to approve and merge, in the env file}
      # WHERE SLACK PLANNING REQUESTS ARE TAKEN FROM, and whose. A sentence typed
      # in this channel by this member becomes a planning request on the bus.
      # Without both, the gateway starts with planning intake switched off and a
      # typed request is silently ignored (the live switch, 1 October 2026).
      JARVIS_SLACK_PLANNING_CHANNEL_ID: ${JARVIS_SLACK_PLANNING_CHANNEL_ID:?name the Slack channel planning requests are typed in, in the env file}
      JARVIS_SLACK_PLANNING_ORIGINATOR_USER_ID: ${JARVIS_SLACK_PLANNING_ORIGINATOR_USER_ID:?name the Slack member id whose sentences become planning requests, in the env file}
      # WHERE A MERGE CARD'S PREVIEW AND EVIDENCE LINKS MAY POINT (17 October 2026).
      # Comma-separated host names; a link becomes a button only when it is https
      # and on one of them. Empty means the card shows no link buttons. Until now
      # this was set only in a hand-written override on the live machine.
      JARVIS_SLACK_EVIDENCE_LINK_HOSTS: ${JARVIS_SLACK_EVIDENCE_LINK_HOSTS:-}
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
      # WHERE IT WRITES DOWN HOW SLACK IS (26 September 2026, build item E3-j2).
      #
      # The gateway holds TWO things open — this bus connection and a Slack
      # Socket Mode websocket — and the second can die on its own: connected to
      # the bus, subscribed, and answering nothing at all from Slack. Nothing
      # outside the process could ask about that, because this service publishes
      # no port and answers nobody on purpose. So it writes one small file, on
      # every connect, disconnect, inbound envelope, session close and transport
      # error, and the watch below reads it.
      #
      # A FILE AND NOT A ROUTE, deliberately: a route would mean this service
      # listening on a port it has no other reason to open.
      #
      # The path is inside the image and the same on every machine; the volume
      # below is mounted there. Nothing in it is secret — a state word and three
      # times.
      JARVIS_SLACK_HEARTBEAT_PATH: /var/lib/jarvis/slack-heartbeat.json
    # ITS OWN SMALL VOLUME, which it writes and the watch mounts read-only. Not
    # shared with the front door's: one writer per volume. A fresh volume is
    # writable with no hand-over because the jarvis image creates
    # /var/lib/jarvis owned by the user it runs as (jarvis images built 26
    # September 2026 or later); an older image leaves it root-owned and the
    # gateway then writes nothing, which the watch reports as unknown.
    volumes:
      - gateway-state:/var/lib/jarvis
    # The same three the front door gets, written out rather than referred to.
    secrets:
      - source: bus-jarvis-password
        target: jarvis_bus_password
      - source: slack-bot-token
        target: slack_bot_token
      - source: slack-app-token
        target: slack_app_token
    networks:
      - factory

  # -------------------------------------------------------------------------
  # THE LINEAR DOOR (18 October 2026, Linear front door design, ai-transition
  # docs/designs/linear-front-door-2026-10-18.md). It checks the factory's
  # Linear team every 30 seconds, sends issues moved to Todo to the factory on
  # the bus exactly as the Slack route does, and writes cards and progress back
  # to the issues as comments. It makes only outgoing calls: no port, nothing
  # public.
  #
  # OFF UNLESS ASKED FOR: it carries the 'linear' profile, so an estate started
  # without '--profile linear' never starts it, and nothing else changes.
  #
  # WHAT IT IS GIVEN:
  #   * the jarvis bus account (the same as the gateway), password as a file;
  #   * the Linear key, as a file it reads itself (JARVIS_LINEAR_API_KEY_FILE),
  #     never in its declared environment and never printed;
  #   * Forge's record, READ-ONLY, the folder and not the one file, exactly as
  #     the answer service mounts it; it opens it with mode=ro as well;
  #   * its own small state volume, with itself as the one writer.
  # It is NOT given the Slack tokens: it never talks to Slack.
  # -------------------------------------------------------------------------
  linear-door:
    profiles: ["linear"]
    image: ${JARVIS_IMAGE:?name the jarvis image in the env file, e.g. JARVIS_IMAGE=jarvis:2026.09.26-3 - built by ../../scripts/build-release-image.sh with the rest of the release}
    # on-failure, not unless-stopped: a door with no team or key set logs one
    # line and exits cleanly, and must then stay stopped.
    restart: on-failure
    depends_on:
      bus-ready:
        condition: service_completed_successfully
      coordinator:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$$JARVIS_NATS_URL" in
          *@*)
            echo "the Linear door's bus address carries a credential. Give the address and the account name plainly in the env file; the password comes in as a file." >&2
            exit 1
            ;;
        esac
        password_file=/run/secrets/jarvis_bus_password
        if [ ! -s "$$password_file" ]; then
            echo "the Linear door was given no bus password file; start the estate the way deploy/estate/README.md says." >&2
            exit 1
        fi
        JARVIS_NATS_PASSWORD="$$(cat "$$password_file")"
        export JARVIS_NATS_PASSWORD
        exec "$$@"
      - linear-door
    command: ["jarvis", "serve-linear"]
    environment:
      JARVIS_NATS_URL: ${JARVIS_NATS_URL:?name the bus's address for jarvis in the env file, e.g. nats://nats:4222 - a service name, with no credential in it}
      JARVIS_NATS_USER: ${JARVIS_NATS_USER:?name the bus account jarvis connects as in the env file}
      JARVIS_NATS_CLIENT_NAME: linear-door-${FACTORY_INSTANCE:-factory}
      JARVIS_LINEAR_API_KEY_FILE: /run/secrets/linear_api_key
      # The Linear team, by its key (for example FAC) or exact name. Unset means
      # the door logs one line and stops, and compose leaves it stopped.
      JARVIS_LINEAR_TEAM: ${JARVIS_LINEAR_TEAM:-}
      JARVIS_LINEAR_DEFAULT_REPO: ${JARVIS_LINEAR_DEFAULT_REPO:-}
      # <linear user id>=<identity>, comma-separated: who may answer a card from
      # Linear, and the identity the answer carries. Kept in the env file on the
      # machine, never in this bundle.
      JARVIS_LINEAR_APPROVERS: ${JARVIS_LINEAR_APPROVERS:-}
      JARVIS_LINEAR_POLL_SECONDS: ${JARVIS_LINEAR_POLL_SECONDS:-30}
      # The owner a Linear request is filed for, so the plan card can still be
      # answered from Slack: the same member id the Slack route files for.
      JARVIS_SLACK_PLANNING_ORIGINATOR_USER_ID: ${JARVIS_SLACK_PLANNING_ORIGINATOR_USER_ID:?name the Slack member id whose sentences become planning requests, in the env file}
      JARVIS_LINEAR_STATE_DIR: /var/lib/jarvis
      JARVIS_LINEAR_FORGE_DB: /var/lib/forge/forge.db
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-INFO}
    volumes:
      - linear-door-state:/var/lib/jarvis
      - forge-ledger:/var/lib/forge:ro
    secrets:
      - source: bus-jarvis-password
        target: jarvis_bus_password
      - source: linear-api-key
        target: linear_api_key

  # -------------------------------------------------------------------------
  # THE GATEWAY WATCH — is the Slack door actually carrying traffic?
  # (26 September 2026, rollout step 1, build item E3-e.)
  #
  # WHAT IT REPLACES. A host timer on the machine this estate is replacing fired
  # every fifteen minutes, asked systemd whether the Slack gateway's user unit
  # was active, and posted to Slack when it was not. The gateway is a container
  # now, so that question has no answer — and after the rollout that unit is
  # meant to be inactive for good, so the old alarm would have called a healthy
  # factory dead every quarter of an hour. It is retired, and this is its named
  # replacement.
  #
  # IT REPORTS THREE THINGS SEPARATELY and never one boolean: whether the
  # gateway's OWN connection is on the bus (its account AND its client name AND
  # its subscription — the account alone is shared with the front door), what the
  # gateway says about its Slack session, and whether its container has gone
  # silent. An unknown is reported as an unknown and never read as healthy.
  #
  # WHY IT IS A LOOP IN A CONTAINER AND NOT A HOST TIMER. A compose file has no
  # timer of its own, so the fifteen minutes had to come from somewhere: the
  # host's cron or a systemd timer calling 'docker compose run', or a container
  # that loops. This is the container, because a host unit is exactly the
  # machine-shaped thing this rollout exists to remove — the estate is meant to
  # start the same way on a clean machine and in the cloud, and a cloud machine
  # has nobody to install a timer. A machine that would rather use its own cron
  # can: the one-shot form is 'docker compose --env-file .env --profile watch run
  # --rm gateway-watch --once'. README.md says both.
  #
  # IT IS BEHIND A PROFILE, like the sandbox service. 'docker compose up' leaves
  # it alone; a machine that wants the watch adds 'watch' to COMPOSE_PROFILES in
  # the env file (not '--profile' on the command line, which REPLACES the env
  # file's profiles). That is also what keeps a rollout window quiet: the profile
  # is added after the estate is up and the door is open.
  #
  # WHAT IT IS GIVEN, AND WHAT THAT COSTS. Three things to read:
  #   * the bus's monitoring route, which takes no credential;
  #   * the gateway's heartbeat volume, READ-ONLY;
  #   * the Docker socket, because reading a container's log means asking the
  #     engine and there is no other way to ask. It is mounted with read_only,
  #     BUT THAT IS NOT THE LIMIT IT SOUNDS LIKE (the E3 review, 26 September
  #     2026): read_only stops writes to the socket FILE, not requests through
  #     it — a process holding this socket can create and remove anything the
  #     engine manages. So this container holds engine control for as long as
  #     it runs, which is always. That is a real privilege, named here rather
  #     than hidden; a machine that will not grant it gets 'unknown' for that
  #     one component, never a false 'ok'. Narrowing it (a socket proxy that
  #     allows only container logs) is the honest next step and is not in this
  #     bundle.
  #
  # IT RESTARTS NOTHING, writes nothing to the bus, and the only secret it ever
  # touches is the Slack token it posts its own alarm with — the retired alarm's
  # own two setting names, unchanged, so Rich's alarms keep arriving where they
  # always did and nothing new has to be configured.
  # -------------------------------------------------------------------------
  gateway-watch:
    profiles: ["watch"]
    image: ${NATS_PROVISION_IMAGE:?name the provisioning image in the env file - built by ./build-estate-images.sh}
    restart: unless-stopped
    depends_on:
      # The same one bus dependency every other service has, so the watch does
      # not ask a bus that is not answering yet and call the door lost.
      bus-ready:
        condition: service_completed_successfully
    # THE SAME SHAPE THE OTHER SERVICES HAVE: a small wrapper that puts the one
    # secret into the environment of the script's own PROCESS and nowhere else,
    # so it is not in this container's declared environment where 'docker
    # inspect' shows it to anybody who can reach the Docker daemon. The variable
    # name is the RETIRED ALARM'S OWN (JARVIS_SLACK_BOT_TOKEN), unchanged, so
    # nothing new has to be configured.
    #
    # A MISSING TOKEN IS NOT A REFUSAL TO START. The watch may be run with the
    # stand-in notifier, which sends nothing and needs no token; and a watch that
    # will not start is a watch that is not watching. It says so loudly, by name,
    # at the moment it actually has something to send.
    #
    # Every '$$' is a dollar sign for the SHELL, escaped so compose leaves it
    # alone. The last item is the shell's $0; the command below follows it and is
    # what "$@" hands to the script — so 'docker compose run --rm gateway-watch
    # --once' works as it reads.
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        token_file=/run/secrets/slack_bot_token
        if [ -s "$$token_file" ]; then
            JARVIS_SLACK_BOT_TOKEN="$$(cat "$$token_file")"
            export JARVIS_SLACK_BOT_TOKEN
        fi
        exec /usr/local/bin/gateway-watch.sh "$$@"
      - the-estate-hands-the-watch-its-token-as-a-file
    command: ["--every", "${GATEWAY_WATCH_INTERVAL_S:-900}"]
    environment:
      # WHERE THE BUS ANSWERS — the same plain monitoring address every other
      # bus question in this bundle uses, in both bus modes, and never with a
      # credential in it.
      BUS_MONITORING_ADDRESS: ${BUS_MONITORING_ADDRESS:?name the bus's monitoring address in the env file, e.g. nats:8222 - a name and a port, with no credential in it}
      # WHOSE CONNECTION IT IS LOOKING FOR — all three parts. The name is built
      # from the same setting the gateway's own name is, in this one file, so the
      # watch cannot end up looking for a name nothing sends.
      JARVIS_NATS_USER: ${JARVIS_NATS_USER:?name the bus account jarvis connects as in the env file}
      GATEWAY_WATCH_CLIENT_NAME: bus-gateway-${FACTORY_INSTANCE:-factory}
      GATEWAY_WATCH_SUBJECT: ${GATEWAY_WATCH_SUBJECT:-agents.command.jarvis}
      # THE GATEWAY'S HEARTBEAT, at the path the gateway writes it to, inside the
      # volume mounted read-only below.
      GATEWAY_WATCH_HEARTBEAT_PATH: /var/lib/jarvis/slack-heartbeat.json
      # HOW OLD IS TOO OLD, for the heartbeat and for the container's log. Both
      # default to six hours, and it is the retired alarm's own number for the
      # retired alarm's own reason: a healthy IDLE door is not silent, and its
      # Slack session rotates roughly every five hours and writes as it goes, so
      # a window shorter than a full rotation turns a quiet Friday into an alarm.
      GATEWAY_WATCH_HEARTBEAT_MAX_AGE_S: ${GATEWAY_WATCH_HEARTBEAT_MAX_AGE_S:-21600}
      GATEWAY_WATCH_MAX_SILENCE_S: ${GATEWAY_WATCH_MAX_SILENCE_S:-21600}
      # How many of the gateway's newest log lines the Slack signal reads. The
      # retired alarm read 300 journal lines; a door logging steadily for another
      # reason could push one trouble line out of a 20-line window inside one
      # interval (the E3 review). 300 here, and a setting.
      GATEWAY_WATCH_LOG_LINES: ${GATEWAY_WATCH_LOG_LINES:-300}
      # WHICH CONTAINER THE GATEWAY IS. Left empty, the watch finds it by its
      # compose labels, taking the project from its own labels — so it finds the
      # gateway of ITS estate and not of another on the same machine.
      GATEWAY_WATCH_GATEWAY_SERVICE: bus-gateway
      GATEWAY_WATCH_CONTAINER: ${GATEWAY_WATCH_CONTAINER:-}
      GATEWAY_WATCH_DOCKER_SOCKET: /var/run/docker.sock
      # WHO IT TELLS. 'slack' is the real notifier, with the retired alarm's own
      # setting names. 'file' is the stand-in a rehearsal uses, which writes the
      # message to a file and sends nothing: no rehearsal ever posts to the real
      # workspace.
      GATEWAY_WATCH_NOTIFIER: ${GATEWAY_WATCH_NOTIFIER:-slack}
      GATEWAY_WATCH_NOTIFIER_FILE: ${GATEWAY_WATCH_NOTIFIER_FILE:-}
      # The retired alarm's OWN two names, so nothing new is configured. They
      # reach this container from the environment the compose command was run in,
      # the same way every other Slack value does. A watch with no token says so
      # loudly when it has something to send; it never fails quietly.
      JARVIS_SLACK_CHANNEL_ID: ${JARVIS_SLACK_CHANNEL_ID:?name the Slack channel the front door posts in, in the env file}
      JARVIS_WATCHDOG_ALERT_CHANNEL_ID: ${JARVIS_WATCHDOG_ALERT_CHANNEL_ID:-}
      # Times are read and compared in UTC, so the container's own zone cannot
      # make a fresh log line look six hours old.
      TZ: UTC
    secrets:
      # THE ONLY SECRET IT TOUCHES. It reads it from the file to post its alarm
      # with, and it is never in this container's declared environment. The
      # script reads it from the variable the retired alarm used, which the
      # entrypoint below fills from the file.
      - source: slack-bot-token
        target: slack_bot_token
    volumes:
      # THE GATEWAY'S HEARTBEAT, READ-ONLY. One writer, one reader.
      - type: volume
        source: gateway-state
        target: /var/lib/jarvis
        read_only: true
      # THE ENGINE'S SOCKET, so a container's log can be read. read_only here
      # guards the socket file, not requests through it — this is engine
      # control, the one real privilege in this service, named plainly.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - factory

  # -------------------------------------------------------------------------
  # THE COORDINATOR, composed in above, with two things added here.
  #
  # ONE: it waits for the bus to be READY and not merely running. Without this
  # line the coordinator starts against a bare bus and restarts in a loop; with
  # it, it does not start at all until 'bus-ready' above has finished
  # successfully.
  #
  # IT WAITS FOR 'bus-ready' AND NOT FOR THE PROVISIONER (26 September 2026,
  # build item E1). 'bus-ready' is the one bus dependency that exists in both bus
  # modes: in local mode it waits for the provisioner and so means exactly what
  # the old line meant, and in external mode it means the retained bus answers
  # and already holds what the pinned definitions name. The provisioner is not in
  # the project at all in external mode, and a dependency on a service whose
  # profile is off makes Compose refuse the whole project.
  #
  # TWO: IT IS GIVEN MEMORY (added 25 September 2026, after the review of this
  # stage). Forge reads its own memory settings from five names — the switch,
  # the store's address, and the three that describe the embedding service
  # (src/forge/adapters/fleet_memory/priors.py). The live coordinator is given
  # all five by ops/forge-prod-recreate.sh. This bundle gave it NONE, and that
  # is not a loud failure: with them unset Forge logs one line — "memory: OFF"
  # — hands the gate an empty priors reader and carries on looking perfectly
  # healthy, every check in this bundle still passing. Replacing the live
  # coordinator with this estate would have turned the factory's memory off and
  # said nothing, which is the exact failure this README names in its own
  # words: the memory flywheel once went dark for a month and nothing said so.
  #
  # THE SWITCH HAS NO DEFAULT HERE, deliberately. FLEET_MEMORY_ENABLED must be
  # written in the env file, true or false, so that memory being off is always
  # somebody's decision and never an omission.
  #
  # THE STORE'S ADDRESS ARRIVES AS A FILE, the same one the two memory
  # containers are given, for the same reason: it carries the store's password.
  # The wrapper below puts it into the environment of the coordinator's own
  # process and nowhere else, so it is not in this container's declared
  # environment where 'docker inspect' would show it.
  #
  # NOTE WHICH ROUTE THIS IS. The coordinator does NOT reach memory through the
  # 'memory' service above: it reads the store directly. The 'memory' service is
  # what a Claude session asks over MCP. Both are memory; they are two different
  # paths to it, and only one of them is the coordinator's. README.md says so at
  # more length.
  #
  # NOT REPEATED HERE: the settings file's name. Forge's own file, composed in,
  # starts the coordinator with '--config /etc/forge/forge.yaml' and sets
  # FORGE_CONFIG_PATH to the same path, so a 'forge cancel' run inside this
  # container reads the approver from the file the gate was built from
  # (13 October 2026). Compose merges the lines below into that service, so the
  # rendered estate carries it; tests/forge/deploy/test_the_estate_bundle.py
  # holds that.
  # -------------------------------------------------------------------------
  coordinator:
    depends_on:
      bus-ready:
        condition: service_completed_successfully
    # Every '$$' below is a dollar sign for the SHELL, escaped so that compose
    # leaves it alone. The last item is the shell's $0; the command the composed
    # file gives this service follows it and is what "$@" hands on. The image's
    # own entrypoint is 'forge', which is what this wrapper execs.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${FLEET_MEMORY_ENABLED}" in
          true|false) ;;
          *)
            echo "the coordinator was given FLEET_MEMORY_ENABLED='$${FLEET_MEMORY_ENABLED}'. It has to say true or false: memory being off is a decision, not an omission, because a coordinator with memory off looks exactly like one with memory on and nothing to say." >&2
            exit 1
            ;;
        esac
        if [ "$${FLEET_MEMORY_ENABLED}" = "true" ]; then
            address_file=/run/secrets/memory_database_address
            if [ ! -s "$${address_file}" ]; then
                echo "the coordinator was told memory is on and was given no database address: the estate passes it in as a file, and this one arrived missing or empty. Start the estate the way deploy/estate/README.md says, with the value passed in from a child process." >&2
                exit 1
            fi
            FLEET_MEMORY_PG_DSN="$$(cat "$${address_file}")"
            export FLEET_MEMORY_PG_DSN
        fi
        exec forge "$$@"
      - the-estate-hands-the-coordinator-its-database-address-as-a-file
    environment:
      # THE SWITCH. No default: the env file has to say true or false.
      FLEET_MEMORY_ENABLED: ${FLEET_MEMORY_ENABLED:?say true or false in the env file - a coordinator with memory off looks exactly like one with memory on and nothing to say, so it has to be a decision}
      # THE EMBEDDING SERVICE, the same three names and the same values the two
      # memory containers above are given. Forge embeds the gate's query with
      # the same model the store was written with; a different model or a
      # different number of dimensions silently returns nothing useful.
      FLEET_MEMORY_EMBED_URL: ${FLEET_MEMORY_EMBED_URL:?name the embedding service's address in the env file}
      FLEET_MEMORY_EMBED_MODEL: ${FLEET_MEMORY_EMBED_MODEL:?name the embedding model in the env file}
      FLEET_MEMORY_EMBED_DIMS: ${FLEET_MEMORY_EMBED_DIMS:?name how many dimensions that model returns in the env file}
    secrets:
      - source: memory-database-address
        target: memory_database_address

  # -------------------------------------------------------------------------
  # ONE PROJECT'S SANDBOX, composed in above and put behind a profile here.
  #
  # A machine has one of these per project sandbox and a cloud machine may have
  # none at all, so it must not start by accident: 'docker compose up' leaves
  # it alone, and a machine that looks after a sandbox says
  # '--profile sandbox'. Nothing else about it is changed here.
  # -------------------------------------------------------------------------
  sandbox-runner:
    profiles: ["sandbox"]

volumes:
  # The bus's store. Forge's four volumes and the publisher's are declared by
  # the files composed in above.
  nats-jetstream:

  # THE MEMORY RELAY'S OWN STATE — the design's table names the relay as its
  # one writer. It replaces ~/.local/state/fleet-memory, a folder under
  # somebody's home directory, which is the last thing the memory row of the
  # design's inventory had to lose.
  memory-state:

  # THE FRONT DOOR'S SAVED THREADS AND CHECKPOINTS, with the front door as its
  # ONE writer (26 September 2026). Without it, replacing that container — the
  # ordinary way this estate takes a new release — deletes every thread Rich
  # approved a spec or said merge in: proved on the release image itself, which
  # answered 404 for a thread its predecessor had. 'down -v' removes it, the
  # same as the bus's store and the relay's marker.
  front-door-state:

  # THE BUS GATEWAY'S OWN STATE, with the gateway as its ONE writer and the
  # gateway watch as its one reader, read-only (26 September 2026, build item
  # E3-j2). Two small files in it: how the gateway's Slack Socket Mode session
  # is, and when it last said so; and (16 October 2026) merge-cards.json, where
  # each previewed merge card was posted, so the gateway can edit it later.
  #
  # IT IS NOT IN THE ROLLOUT'S LIST OF STATE TO CARRY ACROSS, and that is by
  # design: the heartbeat is written fresh on every start, and losing the card
  # file costs only replacement cards (Forge's five-minute sweep describes
  # every live card again and the gateway posts a fresh one it can answer), so
  # nothing a cutover could lose breaks anything. 'down -v' removes it, the
  # same as the bus's store.
  gateway-state:

  # THE LINEAR DOOR'S RECORD of what it has sent and written (18 October 2026),
  # with the door as its one writer. 'down -v' removes it; the door then
  # rebuilds from the bus queue and Forge's record before sending anything.
  linear-door-state:

  # THE BUS'S OWN CONFIG AND PROVISIONING SCRIPTS, at the pinned commit.
  #
  # It is EXTERNAL because it is made by the build step beside the two images,
  # out of the same fetch, and it belongs to the release rather than to a run:
  # 'down -v' removes a run's storage and must not take the release's content
  # with it. ./build-estate-images.sh makes it and fills it; removing it is
  # 'docker volume rm', the same as removing an image.
  bus-source:
    external: true
    name: ${BUS_SOURCE_VOLUME:?name the volume holding the bus repository's config and provisioning scripts - ./build-estate-images.sh makes it and prints its name}

# ---------------------------------------------------------------------------
# THE BUS'S EIGHT ACCOUNT PASSWORDS, AS FILES.
#
# Each one is read from the environment the 'docker compose' command was run
# in — which is a child process of 'sops exec-env', and the only place a value
# can come from — and is handed to the container as a file under /run/secrets.
# No value is in any file in this bundle, in any image, in any container's
# declared environment, or in anything either service prints.
#
# Two things follow that are worth knowing:
#
#   * 'docker compose config' RENDERS WITHOUT THEM. A secret names an
#     environment variable rather than interpolating it, so reading the estate
#     — 'ps', 'config', the estate's own two commands after it has started —
#     needs no password at all. Only starting it does. Before 24 September's
#     review these were interpolated with ':?', and every command that had to
#     render the file refused in a clean shell;
#   * A MISSING ONE STILL STOPS THE START, loudly and by name: compose refuses
#     to start a service whose secret names a variable nothing set.
# ---------------------------------------------------------------------------
secrets:
  bus-admin-password:
    environment: ADMIN_NATS_PASSWORD
  bus-rich-password:
    environment: RICH_NATS_PASSWORD
  bus-james-password:
    environment: JAMES_NATS_PASSWORD
  bus-mark-password:
    environment: MARK_NATS_PASSWORD
  bus-forge-password:
    environment: FORGE_NATS_PASSWORD
  bus-fleet-memory-password:
    environment: FLEET_MEMORY_NATS_PASSWORD
  bus-guardkit-password:
    environment: GUARDKIT_NATS_PASSWORD
  bus-jarvis-password:
    environment: JARVIS_NATS_PASSWORD

  # The account the one-shot provisions the bus's storage as. The env file says
  # WHICH of the eight names above that account's password is under, so the
  # account can be changed in the env file without changing this file — and so
  # that it is always one of the eight the bus itself is given.
  bus-provision-password:
    environment: ${NATS_PROVISION_PASSWORD_NAME:?name which of the bus's eight password names the provisioning account's password is under, e.g. RICH_NATS_PASSWORD}

  # THE MEMORY STORE'S ADDRESS, WHICH CARRIES ITS PASSWORD. One value, so one
  # secret: it is read from the environment the command was run in — the same
  # child process the bus's passwords come from — and handed to the two memory
  # containers as a file. It is in no file in this bundle, in no image, in no
  # container's declared environment and in nothing either service prints.
  memory-database-address:
    environment: FLEET_MEMORY_PG_DSN

  # THE MODEL DOOR'S KEY (14 October 2026). A model-router key minted for the
  # door alone, read from the environment the command was run in — the same
  # child process the other secrets come from — and handed to the model door
  # as a file. It is in no file in this bundle, in no image, in no container's
  # declared environment and in nothing the door prints. It never enters a
  # project's sandbox: that is the whole point of the door.
  sandbox-model-key:
    environment: SANDBOX_MODEL_KEY

  # THE GIT DOOR'S TOKEN (17 October 2026). A fine-grained GitHub token,
  # Contents and Metadata read-only, read from the environment the command
  # was run in and handed to the Git door as a file, as the model door's key
  # is. Only the door, behind its 'git-door' profile, asks for it; it never
  # enters a project's sandbox.
  git-door-token:
    environment: GIT_DOOR_TOKEN

  # THE FRONT DOOR'S TWO SLACK CREDENTIALS, added 25 September 2026.
  #
  # A bot token (it posts and edits messages) and an app-level token (it opens
  # the outbound WebSocket Slack sends events down). Both are read from the
  # environment the command was run in — the same child process the bus's
  # passwords come from — and handed to the two jarvis services as files. They
  # are in no file in this bundle, in no image, in no container's declared
  # environment and in nothing either service prints.
  #
  # BOTH SERVICES GET BOTH, because both live host units have both today. Which
  # of the two should hold the Slack reply path is a question for the front
  # door's owner, and README.md records it rather than this bundle deciding it
  # quietly.
  slack-bot-token:
    environment: JARVIS_SLACK_BOT_TOKEN
  slack-app-token:
    environment: JARVIS_SLACK_APP_TOKEN
  # The Linear door's key (18 October 2026), read from the same child process
  # environment as the others; only the 'linear' profile's service uses it.
  linear-api-key:
    environment: LINEAR_API_KEY
