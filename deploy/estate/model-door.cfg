# ---------------------------------------------------------------------------
# THE MODEL DOOR (14 October 2026) — the one way a project's sandbox reaches
# the model router, and the only place the sandbox's model key is held.
#
# The sandbox is given no model key: its containers send a fixed placeholder.
# This door listens on the factory gateway address only, replaces whatever key
# a caller sent with its own, and passes the call on to the model router on
# this machine's loopback. A sandbox can therefore use the models while a
# build runs, but it holds nothing it could carry away.
#
# Two values come from the container's environment, never from this file:
#   MODEL_DOOR_BIND  the gateway address and port, which compose.yaml builds
#                    from FACTORY_GATEWAY_ADDRESS and MODEL_DOOR_PORT;
#   MODEL_DOOR_KEY   the key, read from a secret FILE by the service's own
#                    entry shell (compose.yaml), so it is in no declared
#                    setting that 'docker inspect' shows.
#
# No header is logged and nothing is captured: a log line names the route and
# the status, never the key.
# ---------------------------------------------------------------------------
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # The feature router's timeouts: a model answer can take a long time.
    timeout connect 5s
    timeout client 7200s
    timeout server 7200s
    timeout http-request 10s

frontend model_door
    bind "${MODEL_DOOR_BIND}"
    # Whatever key the caller sent, in any header a model router reads one
    # from, goes; the door's own key is the only one passed on.
    http-request del-header x-api-key
    http-request del-header api-key
    http-request del-header x-litellm-api-key
    http-request set-header Authorization "Bearer ${MODEL_DOOR_KEY}"
    default_backend model_router

backend model_router
    # The model router on this machine's own loopback. The door runs on the
    # host's network to reach it there, so it never crosses the guard that
    # refuses Docker's bridges on the router's port.
    server router 127.0.0.1:4000
