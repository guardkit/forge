# ---------------------------------------------------------------------------
# THE GIT DOOR (17 October 2026) — the one way a project's sandbox reads a
# private repository, and the only place the read token is held.
#
# The sandbox is given no GitHub credential. This door listens on the factory
# gateway address only, takes git's two READ requests for a repository on its
# allow-list, adds its own read-only token, and passes them to github.com
# over verified TLS. Everything else gets 403: a push (git-receive-pack), any
# other path or method, and any repository not on the list.
#
# Two values come from the container's environment, never from this file:
#   GIT_DOOR_BIND   the gateway address and port, which compose.yaml builds
#                   from FACTORY_GATEWAY_ADDRESS and GIT_DOOR_PORT;
#   GIT_DOOR_BASIC  base64 of "x-access-token:<token>", built by the
#                   service's own entry shell from a secret FILE
#                   (compose.yaml), so it is in no declared setting.
# The allow-list is the file bound at /usr/local/etc/haproxy/git-door.repos,
# one owner/name per line (blank lines and # comments are left out).
#
# No header is logged and nothing is captured: a log line names the path and
# the status, never the token.
# ---------------------------------------------------------------------------
global
    log stdout format raw local0
    ca-base /etc/ssl/certs

# github.com is looked up while the door runs, from the machine's own
# resolver, so a change of GitHub's addresses needs no restart, and a door
# started while the name does not resolve still starts.
resolvers machine
    parse-resolv-conf
    hold valid 60s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 10s
    timeout client 600s
    timeout server 600s
    timeout http-request 10s

frontend git_door
    bind "${GIT_DOOR_BIND}"

    # The two read requests of git's smart HTTP protocol, and nothing else:
    #   GET  /<owner>/<name>.git/info/refs?service=git-upload-pack
    #   POST /<owner>/<name>.git/git-upload-pack            (no query)
    acl refs_method   method GET
    acl pack_method   method POST
    acl refs_path     path_reg ^/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]git/info/refs$
    acl pack_path     path_reg ^/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+[.]git/git-upload-pack$
    acl upload_query  query -m str service=git-upload-pack
    acl any_query     query -m found

    # The repository the request names, as owner/name, matched exactly
    # (case and all) against the allow-list.
    http-request set-var(txn.owner) path,field(2,/)
    http-request set-var(txn.name) path,field(3,/),regsub([.]git$,"")
    http-request set-var(txn.repo) var(txn.owner),concat(/,txn.name)
    acl listed        var(txn.repo) -m str -f /usr/local/etc/haproxy/git-door.repos

    http-request deny deny_status 403 unless listed refs_method refs_path upload_query or listed pack_method pack_path !any_query

    # Whatever credential a caller sent goes; the door's own token is the only
    # one passed on, and the host is GitHub's.
    http-request del-header Authorization
    http-request del-header Proxy-Authorization
    http-request del-header Cookie
    http-request set-header Authorization "Basic ${GIT_DOOR_BASIC}"
    http-request set-header Host github.com
    default_backend github

backend github
    # TLS checked against the image's own certificate list, with GitHub's
    # name sent and verified.
    server github github.com:443 ssl verify required ca-file ca-certificates.crt sni str(github.com) verifyhost github.com resolvers machine init-addr last,libc,none
