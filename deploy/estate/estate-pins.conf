# ---------------------------------------------------------------------------
# THE ESTATE'S PINS — what the two estate-only images are built from.
#
# This file is part of the release, not part of a machine: no address, no path
# and no value belonging to anybody is in it, and nothing here is edited per
# machine. ./build-estate-images.sh reads it.
#
# Forge's own two images are pinned in ../../release/manifest.yaml, which the
# release script reads; this file is the same idea for the two images the
# estate needs that the release script does not build. README.md says why they
# are not in the manifest yet.
# ---------------------------------------------------------------------------

# --- the bus ----------------------------------------------------------------
# The bus repository, fetched fresh from GitHub at this exact commit into a
# temporary folder and built with ITS OWN Dockerfile. Never from a checkout
# that happens to sit beside this one: a checkout is a machine's, and two
# machines' checkouts are not the same bytes.
#
# The repository is public, so the fetch needs no credential.
BUS_REPOSITORY_URL=https://github.com/guardkit/nats-infrastructure.git
BUS_REPOSITORY_BRANCH=main
BUS_REPOSITORY_COMMIT=8829c6e7895059efc30ada52580ef9a6476873db

# The name the bus image is built under. Its tag is the release version, from
# ../../release/manifest.yaml, so the whole estate moves as one release and the
# example env file can be held to it by a test.
BUS_IMAGE_NAME=factory-nats

# --- the one-shot that provisions the bus's storage -------------------------
# The NATS project's own tool image, which carries the `nats` command line and
# `jq`. provisioner/Dockerfile adds `bash` and nothing else, because the bus
# repository's provisioning scripts are bash scripts. Pinned by digest as well
# as by tag: a tag can be moved, a digest cannot.
BUS_PROVISION_BASE_IMAGE=natsio/nats-box:0.18.0
BUS_PROVISION_BASE_DIGEST=sha256:abdc9f9f0120bb8adfbf674eb037d1551db55356eb198b7bd4ffed377f6950a6
BUS_PROVISION_IMAGE_NAME=factory-nats-provision

# --- the bus's own config and provisioning scripts --------------------------
# They travel in a volume rather than a folder on a disk, so the running estate
# names no path belonging to a machine. The build step makes the volume,
# named <this>-<release version>, and fills it from the same fetch.
BUS_SOURCE_VOLUME_NAME=factory-bus-source
