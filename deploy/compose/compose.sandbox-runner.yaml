# ---------------------------------------------------------------------------
# ONE PROJECT'S SANDBOX, LOOKED AFTER BY A CONTAINER (24 September 2026,
# stage 3 of the containerisation rollout gate).
#
# This file replaces the two host units that looked after a project's sandbox:
#
#     forge-sandbox-keeper@<sandbox>    held the sandbox awake
#     forge-sandbox-runner@<sandbox>    ran the project's bootstrap inside it
#
# It is a FILE OF ITS OWN, and not part of compose.yaml, for two reasons: a
# machine has one of these per project sandbox, and a machine with no sandbox
# at all (a cloud machine that has not been given one yet) should not have to
# comment a service out. Compose them together:
#
#     docker compose --env-file .env \
#       -f compose.yaml -f compose.sandbox-runner.yaml up -d
#
# THIS IS THE ONE SERVICE IN THE BUNDLE THAT TOUCHES THE HOST beyond Docker
# itself, and it is worth saying why that is allowed. A sandbox is a small
# machine of its own, made by the SANDBOX DAEMON, and that daemon is the host:
# there is nothing to containerise about it any more than about the Docker
# daemon underneath this file. So this service is given exactly two things of
# the machine's — the daemon's socket, and the static client binary that
# speaks to it, read-only — and nothing else: no network, no published port,
# no checkout, no home folder, no settings file. Both are named in .env, so
# this file carries no path belonging to any machine.
#
# WHAT IT DOES NOT DO: it never creates, removes or reconfigures a sandbox.
# Making one is still an attended step (the project's own wrapper does it on a
# first deploy). This service holds one awake, runs the project's own
# bootstrap inside it, and stops that work when it is stopped.
# ---------------------------------------------------------------------------

services:

  sandbox-runner:
    # The release image, the same one the coordinator runs, with a different
    # start command — the supervisor script the image carries at
    # /opt/forge/sandbox-runner/run.sh. Nothing is built here.
    image: ${FORGE_IMAGE:?name the release image in the env file - this file never picks one for you}
    entrypoint: ["/bin/bash", "/opt/forge/sandbox-runner/run.sh"]
    command: []

    # THE HOST USER'S OWN NUMBERS. The daemon's socket is owner-only, so the
    # container has to be that owner to say a word to it. This is the one
    # place in the bundle where a service does not run as the image's own
    # user, and the reason is the socket's permissions, nothing else.
    user: "${FACTORY_HOST_UID:?name the uid that owns the sandbox daemon in the env file}:${FACTORY_HOST_GID:?name that user's gid in the env file}"

    restart: unless-stopped

    # NO HEALTH PROBE. The release image carries one of its own — it curls the
    # coordinator's /healthz — and this service serves nothing at all, so the
    # inherited probe would mark it unhealthy for ever, from the first minute,
    # while it was doing its job perfectly (seen on 24 September 2026, in the
    # events of the very first container). What "healthy" would mean here is a
    # question about the sandbox, not about this container, and it belongs to
    # the estate's own check.
    healthcheck:
      disable: true

    # THE WHOLE POINT OF THE PASS. A stop signal here runs the project's
    # bootstrap's own stop mode INSIDE the sandbox and waits for it, because
    # ending the client out here ends nothing in there. Docker must therefore
    # wait too: this is the ceiling on that wait, and it is deliberately above
    # SANDBOX_STOP_TIMEOUT_SECONDS so the script gives up before Docker does
    # and can still release its hold. The unit this replaces allowed 60s.
    stop_grace_period: ${SANDBOX_STOP_GRACE_PERIOD:-90s}
    stop_signal: SIGTERM

    # NO NETWORK AT ALL. Everything this service says, it says over a unix
    # socket. It joins no network, publishes no port and can reach neither the
    # factory network nor the machine's own. Proven on 24 September 2026: the
    # client did the whole of its work from a container started with none.
    network_mode: "none"

    environment:
      # WHICH SANDBOX. The name the project declares; nothing here knows it.
      SANDBOX_NAME: ${SANDBOX_NAME:?name the project's sandbox in the env file}
      # WHAT TO RUN INSIDE IT, and the word it takes to stop itself. The
      # project declares both. This service knows no process names and no
      # ports: stopping is one word through the same door as starting.
      SANDBOX_BOOTSTRAP: ${SANDBOX_BOOTSTRAP:?name the command this project's sandbox runs in the env file}
      SANDBOX_BOOTSTRAP_STOP_ARGUMENT: ${SANDBOX_BOOTSTRAP_STOP_ARGUMENT:-stop}
      # THE NAMES THE BOOTSTRAP IS HANDED, as a list of names. Every value
      # stays in .env; this service forwards whatever those names hold and
      # never reads one. A name with nothing set is left out.
      SANDBOX_ENV_NAMES: ${SANDBOX_ENV_NAMES:-}
      SANDBOX_CLIENT: /usr/bin/sbx
      SANDBOX_CLIENT_ARGUMENTS: ${SANDBOX_CLIENT_ARGUMENTS:-}
      SANDBOX_RESTART_SECONDS: ${SANDBOX_RESTART_SECONDS:-5}
      SANDBOX_STOP_TIMEOUT_SECONDS: ${SANDBOX_STOP_TIMEOUT_SECONDS:-45}
      # THE CLIENT'S OWN STATE FOLDER. It must be writable and it must be the
      # folder the socket sits under, at exactly the path below. Put the
      # socket anywhere else and the client decides it is talking to a hosted
      # service and complains about authentication, which has nothing to do
      # with what is wrong (learned twice, 24 September 2026).
      SANDBOXES_STORAGE_ROOT: /var/lib/forge-sandbox-client

    # THE PROJECT'S OWN SETTINGS, as one file of names and values that the
    # machine supplies — by default the same .env as everything else here.
    # Compose hands that whole file to this container, and SANDBOX_ENV_NAMES
    # above says which of those names are handed on INTO the sandbox.
    #
    # THIS FILE NAMES NONE OF THEM, deliberately. The live machine's unit
    # drop-in had fourteen of a project's settings written into one start
    # line, so adding one meant editing a file per machine — and several of
    # them belong to one project's toolchain and have no business in the
    # factory's own files. A project with a different toolchain writes a
    # different list in its own .env and nothing here changes.
    #
    # Everything else in that file arrives in this container's environment
    # too (image tag, addresses, the PATH of the publisher's credential file —
    # never its contents). Only the names listed in SANDBOX_ENV_NAMES cross
    # into the sandbox.
    env_file:
      - path: ${SANDBOX_PROJECT_ENV_FILE:-.env}
        required: false

    volumes:
      # THE CLIENT'S OWN STATE. A small named volume, this container's alone.
      # A fresh one belongs to root, and this container is not root: hand it
      # over once, as README.md says. This is the ONLY volume in the bundle
      # that still needs that, and the reason is directly above — this service
      # alone runs as the MACHINE's user rather than the image's, so the image
      # cannot make the folder for the right user in advance. The coordinator's
      # four volumes stopped needing it at release 2026.09.24-4, when the image
      # started making those folders as its own user.
      - sandbox-client-state:/var/lib/forge-sandbox-client
      # THE CLIENT BINARY, read-only. One statically linked file; the machine
      # says where it is.
      - ${SBX_BINARY_PATH:?name the sandbox client binary in the env file}:/usr/bin/sbx:ro
      # THE SANDBOX DAEMON'S SOCKET, at the one path the client looks for it
      # under its storage root. This is the whole of what this container has
      # of the host.
      - ${SANDBOXD_SOCKET_PATH:?name the sandbox daemon's socket in the env file}:/var/lib/forge-sandbox-client/state/sandboxes/sandboxes/sandboxd/sandboxd.sock

volumes:
  sandbox-client-state:
