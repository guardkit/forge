# 2026-08-31, Rich's word: turn ON the half of the architecture mechanism that sends a
# finding in freshly written code back to the code generator as a fix-this issue on its
# next turn. The code ships with this OFF; this file is the whole switch.
#
# To turn it off again: delete this file, then
#   systemctl --user daemon-reload && systemctl --user restart forge-langgraph-sidecar
# Nothing else needs changing, and no build is harmed by the switch being absent.
#
# It judges a task only on the files that task changed, so the violation deliberately
# left in api_test's main cannot fail an unrelated build.
[Service]
Environment=GUARDKIT_ARCH_CONFORMANCE_BLOCKING=1
